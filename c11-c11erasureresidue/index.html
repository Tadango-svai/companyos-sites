<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>c11: Erasure & Residue</title>
    <style>
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #silence-text {
            font-size: 5rem;
            letter-spacing: 1rem;
            color: #333;
            transition: all 0.5s ease;
            user-select: none;
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background-color: #fff;
            opacity: 0;
            pointer-events: none;
        }
        button {
            margin-top: 2rem;
            padding: 10px 20px;
            background: transparent;
            color: #666;
            border: 1px solid #333;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            color: #fff;
            border-color: #fff;
        }
        #status {
            margin-top: 1rem;
            color: #444;
            font-size: 0.8rem;
            height: 1.2em;
        }
        h1 {
            position: absolute;
            top: 20px;
            font-size: 0.9rem;
            color: #333;
            letter-spacing: 0.5em;
        }
    </style>
</head>
<body>
    <h1>ERASURE / RESIDUE</h1>
    <div id="container">
        <div id="silence-text">沈黙</div>
        <button id="erase-btn" onclick="erase()">消去する</button>
        <div id="status">沈黙は、消去されても残響を残す。</div>
    </div>

    <script>
        const text = document.getElementById('silence-text');
        const container = document.getElementById('container');
        const status = document.getElementById('status');
        const btn = document.getElementById('erase-btn');

        function createParticle(x, y) {
            const p = document.createElement('div');
            p.classList.add('particle');
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            container.appendChild(p);

            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 2 + 0.5;
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed;
            
            let opacity = 1;
            let px = x;
            let py = y;

            function animate() {
                px += vx;
                py += vy;
                opacity -= 0.01;
                p.style.left = px + 'px';
                p.style.top = py + 'px';
                p.style.opacity = opacity;

                if (opacity > 0) {
                    requestAnimationFrame(animate);
                } else {
                    // 残響として極端に薄い状態で残す
                    p.style.opacity = 0.05 + Math.random() * 0.05;
                    p.style.width = '1px';
                    p.style.height = '1px';
                    p.style.background = '#555';
                }
            }
            requestAnimationFrame(animate);
        }

        function erase() {
            btn.style.visibility = 'hidden';
            status.textContent = '消去処理中...';
            
            // テキストの各文字位置を取得してパーティクルを生成
            const range = document.createRange();
            range.selectNodeContents(text);
            const rects = range.getClientRects();
            
            // 簡易的に中央付近から爆発させる
            const rect = text.getBoundingClientRect();
            for (let i = 0; i < 100; i++) {
                const x = rect.left + (rect.width / 2) + (Math.random() - 0.5) * rect.width;
                const y = rect.top + (rect.height / 2) + (Math.random() - 0.5) * rect.height;
                createParticle(x, y);
            }

            text.style.opacity = 0;
            text.style.transform = 'scale(0.8)';
            
            setTimeout(() => {
                text.style.display = 'none';
                status.textContent = '残響のみが、空間を満たす。';
            }, 500);
        }
    </script>

</html>
