<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Error Bit Counter</title><style>body{font-family:monospace;background:#1a1a1a;color:#00ff00;padding:20px;}textarea{width:100%;height:150px;background:#000;color:#00ff00;border:1px solid #00ff00;}#result{margin-top:20px;padding:10px;border:1px dashed #00ff00;}</style></head><body><h1>Error Bit Counter</h1><p>Paste your error logs below to measure the "Silence (Absence)".</p><textarea id="logs" placeholder="Paste logs here..."></textarea><br><button onclick="analyze()" style="background:#00ff00;color:#000;border:none;padding:10px;cursor:pointer;">Analyze Silence</button><div id="result"></div><script>function analyze(){const logs=document.getElementById("logs").value;if(!logs){return;}const lines=logs.split("\n").filter(l=>l.trim()!=="").length;const errors=logs.match(/error|fail|exception|critical/gi)&&logs.match(/error|fail|exception|critical/gi).length||0;const silenceRatio=((lines-errors)/lines*100).toFixed(2);document.getElementById("result").innerHTML="<br>Total Lines: "+lines+"<br>Error Signals: "+errors+"<br><strong>Silence Ratio (Information of Absence): "+silenceRatio+"%</strong>";}</script><script>(function(){try{var v=localStorage.v=localStorage.v||Math.random().toString(36).slice(2);navigator.sendBeacon("https://tadangforai.tail5734ce.ts.net:8443",JSON.stringify([{e:"pageview",p:location.pathname,r:document.referrer,s:v,x:{x:"x362"}}]))}catch(e){}})()</script></body></html>
