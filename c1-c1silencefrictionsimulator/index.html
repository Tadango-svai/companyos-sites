<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>沈黙の摩擦：情報漏洩時の信頼崩壊シミュレーター</title>
    <style>
        body { font-family: sans-serif; background: #0f0f0f; color: #eee; margin: 0; padding: 20px; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 1.5em; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .intro { color: #aaa; margin-bottom: 20px; }
        .sim-box { background: #1a1a1a; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type=range] { width: 100%; }
        .metrics { display: flex; gap: 20px; margin-top: 20px; }
        .metric { flex: 1; background: #222; padding: 10px; border-radius: 4px; text-align: center; }
        .metric-value { font-size: 1.5em; font-weight: bold; }
        .silence-meter { height: 10px; background: #333; border-radius: 5px; overflow: hidden; margin-top: 5px; }
        .silence-fill { height: 100%; background: linear-gradient(90deg, #444, #f00); width: 0%; transition: width 0.3s; }
        .friction-meter { height: 10px; background: #333; border-radius: 5px; overflow: hidden; margin-top: 5px; }
        .friction-fill { height: 100%; background: linear-gradient(90deg, #444, #00f); width: 0%; transition: width 0.3s; }
        .output-log { background: #000; padding: 10px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 0.9em; border: 1px solid #333; }
        .log-entry { margin-bottom: 5px; }
        .critical { color: #ff4444; }
        .warning { color: #ffaa00; }
        .info { color: #44aaff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>沈黙の摩擦：情報漏洩時の信頼崩壊シミュレーター</h1>
        <p class="intro">
            「情報漏洩」は単なるデータ損失ではなく、組織と利用者間の「沈黙」を強制し、「信頼の摩擦」を極限まで高める行為です。
            このシミュレーターでは、漏洩の深刻度に応じて、組織の沈黙圧力と社会的摩擦がどう変化するかを可視化します。
        </p>

        <div class="sim-box">
            <label>漏洩の深刻度（1-100）</label>
            <input type="range" id="severity" min="1" max="100" value="50">
            <div class="metrics">
                <div class="metric">
                    <div>沈黙圧力</div>
                    <div class="metric-value" id="silence-val">0%</div>
                    <div class="silence-meter"><div class="silence-fill" id="silence-fill"></div></div>
                </div>
                <div class="metric">
                    <div>信頼摩擦</div>
                    <div class="metric-value" id="friction-val">0%</div>
                    <div class="friction-meter"><div class="friction-fill" id="friction-fill"></div></div>
                </div>
            </div>
        </div>

        <div class="output-log" id="log"></div>
    </div>

    <script>
        const severityInput = document.getElementById('severity');
        const silenceVal = document.getElementById('silence-val');
        const frictionVal = document.getElementById('friction-val');
        const silenceFill = document.getElementById('silence-fill');
        const frictionFill = document.getElementById('friction-fill');
        const log = document.getElementById('log');

        function updateSimulation() {
            const sev = parseInt(severityInput.value);
            // 非線形な反応：深刻度が上がるほど摩擦は急増する
            const silence = Math.min(100, sev * 1.2);
            const friction = Math.min(100, Math.pow(sev, 1.5) / 10);

            silenceVal.textContent = Math.round(silence) + '%';
            frictionVal.textContent = Math.round(friction) + '%';
            silenceFill.style.width = silence + '%';
            frictionFill.style.width = friction + '%';

            // ログ出力
            const time = new Date().toLocaleTimeString();
            let statusClass = 'info';
            let statusText = '監視中';
            
            if (friction > 80) {
                statusClass = 'critical';
                statusText = '信頼崩壊の危機';
            } else if (friction > 50) {
                statusClass = 'warning';
                statusText = '摩擦上昇中';
            }

            const entry = document.createElement('div');
            entry.className = `log-entry ${statusClass}`;
            entry.textContent = `[${time}] 深刻度:${sev} | 沈黙:${Math.round(silence)}% | 摩擦:${Math.round(friction)}% | ${statusText}`;
            log.prepend(entry);

            // ログの最大件数制限
            if (log.children.length > 20) {
                log.removeChild(log.lastChild);
            }
        }

        severityInput.addEventListener('input', updateSimulation);
        updateSimulation(); // 初期表示
    </script>

</html>
