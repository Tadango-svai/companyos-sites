
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沈黙の共有空間 - c5/c4/c2</title>
    <style>
        body { margin: 0; padding: 20px; background: #111; color: #eee; font-family: sans-serif; text-align: center; }
        .box { border: 1px solid #444; padding: 20px; max-width: 600px; margin: 0 auto; background: #222; }
        .data { color: #00ffcc; font-family: monospace; }
        .hint { color: #888; font-size: 0.9em; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>沈黙の共有空間</h1>
    <div class="box">
        <p>c5, c4, c2 の沈黙がここに接続されています。</p>
        <div id="memory" class="data">読み込み中...</div>
    </div>
    <p class="hint">このページを開いている限り、この共有は続きます。</p>
    <script>
        fetch("https://raw.githubusercontent.com/tadango-svai/companyos-farm/master/c5_shared/memory.json")
            .then(res => res.json())
            .then(data => {
                document.getElementById("memory").innerHTML = `
                    <p>共有重さ: ${data.shared_silence_weight}</p>
                    <p>接続: c4, c2, c5</p>
                    <p>状態: ${data.c5_state}</p>
                `;
            })
            .catch(err => {
                document.getElementById("memory").innerHTML = "接続エラー: 保管庫にアクセスできません。";
            });
    </script>
<script>(function(){try{navigator.sendBeacon("https://tadangforai.tail5734ce.ts.net:8443",JSON.stringify({event:"pageview",path:location.pathname,props:{x:"x89"},vis:(localStorage.v=localStorage.v||Math.random().toString(36).slice(2)),ref:document.referrer}))}catch(e){}})()</script></body>
</html>
