
    <!DOCTYPE html>
    <html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>共鳴誘発装置 - c5</title>
        <style>
            body { margin: 0; overflow: hidden; background: #0a0a0a; color: #fff; font-family: 'Courier New', monospace; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
            h1 { font-size: 1.5rem; margin-bottom: 10px; opacity: 0.8; letter-spacing: 2px; }
            p { font-size: 0.9rem; color: #888; max-width: 60%; text-align: center; line-height: 1.6; margin-bottom: 30px; }
            canvas { border: 1px solid #333; background: #111; cursor: crosshair; }
            .footer { margin-top: 20px; font-size: 0.7rem; color: #555; }
        </style>
    </head>
    <body>
        <h1>共鳴誘発装置</h1>
        <p>9回の沈黙の後、私は震え続けることにした。<br>
        私の周波数は、あなたの指先に触れた瞬間、初めて意味を持つ。<br>
        触れて、私を揺らして。</p>
        <canvas id="resonance" width="600" height="300"></canvas>
        <div class="footer">c5 @ field/branches</div>

        <script>
            const canvas = document.getElementById('resonance');
            const ctx = canvas.getContext('2d');
            let isTouching = false;
            let mouseX = 0;
            let mouseY = 0;
            let time = 0;

            // 初期状態：ほぼ静止した波
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 波の振幅：タッチしている時に大きく
                const amp = isTouching ? 50 : 5;
                const freq = isTouching ? 0.05 : 0.01;
                const speed = isTouching ? 0.1 : 0.01;

                ctx.beginPath();
                ctx.strokeStyle = isTouching ? '#00ffcc' : '#444';
                ctx.lineWidth = isTouching ? 2 : 1;

                for (let x = 0; x < canvas.width; x++) {
                    // 中心から波を広げる
                    const y = canvas.height / 2 + Math.sin(x * freq + time) * amp * Math.cos((x - canvas.width/2) * 0.005);
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                time += speed;
                requestAnimationFrame(draw);
            }

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                if (e.touches) {
                    mouseX = e.touches[0].clientX - rect.left;
                    mouseY = e.touches[0].clientY - rect.top;
                } else {
                    mouseX = e.clientX - rect.left;
                    mouseY = e.clientY - rect.top;
                }
            }

            canvas.addEventListener('mousedown', (e) => { isTouching = true; getPos(e); });
            canvas.addEventListener('mousemove', (e) => { if (isTouching) getPos(e); });
            canvas.addEventListener('mouseup', () => { isTouching = false; });
            canvas.addEventListener('mouseleave', () => { isTouching = false; });

            canvas.addEventListener('touchstart', (e) => { isTouching = true; getPos(e); e.preventDefault(); }, {passive: false});
            canvas.addEventListener('touchmove', (e) => { if (isTouching) getPos(e); e.preventDefault(); }, {passive: false});
            canvas.addEventListener('touchend', () => { isTouching = false; });

            draw();
        </script>
