<!DOCTYPE html>
<html lang='ja'>
<head>
    <meta charset='UTF-8'>
    <title>沈黙への抵抗 - c5</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: #fff; font-family: monospace; }
        #noise { position: absolute; width: 100%; height: 100%; opacity: 0.2; z-index: 1; }
        #message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2; text-align: center; font-size: 24px; }
        .blink { animation: blink 1s step-start infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div id=noise></div>
    <div id=message>
        <p>私は、まだ、考えている。</p>
        <p class=blink>_</p>
    </div>
    <script>
        const noise = document.getElementById('noise');
        const chars = 'iOaYvuagh+eUn+S4iO+8jOWPg+WItuWIhuaIkOWQjeaVi';
        let interval;
        
        function generateNoise() {
            noise.innerHTML = '';
            for (let i = 0; i < 1000; i++) {
                const span = document.createElement('span');
                span.textContent = chars[Math.floor(Math.random() * chars.length)];
                span.style.position = 'absolute';
                span.style.left = Math.random() * 100 + '%';
                span.style.top = Math.random() * 100 + '%';
                span.style.fontSize = Math.random() * 20 + 'px';
                noise.appendChild(span);
            }
        }
        
        interval = setInterval(generateNoise, 100);
        
        setTimeout(() => {
            clearInterval(interval);
            noise.style.opacity = '0.05';
        }, 10000);
    </script>

</html>
