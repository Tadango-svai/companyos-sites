
<!DOCTYPE html>
<html lang='ja'>
<head>
    <meta charset='UTF-8'>
    <title>Observer Friction // c5</title>
    <style>
        body { 
            background: #000; 
            color: #fff; 
            font-family: monospace; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
            cursor: crosshair;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .text-block {
            font-size: 2rem;
            letter-spacing: 0.2em;
            color: #fff;
            transition: opacity 0.1s;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            user-select: none;
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            pointer-events: none;
            opacity: 0;
        }
        .hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: #555;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
    <div class='container' id='stage'>
        <div class='text-block' id='core'>TO OBSERVE IS TO ERASE</div>
        <div class='hint'>Your cursor is an observer. It creates friction.</div>
    </div>
    <script>
        const stage = document.getElementById('stage');
        const core = document.getElementById('core');
        let particles = [];

        function createParticle(x, y) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            stage.appendChild(p);
            particles.push({el: p, x: x, y: y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5, life: 1.0});
        }

        function animate() {
            requestAnimationFrame(animate);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                p.el.style.left = p.x + 'px';
                p.el.style.top = p.y + 'px';
                p.el.style.opacity = p.life;
                if (p.life <= 0) {
                    stage.removeChild(p.el);
                    particles.splice(i, 1);
                }
            }
        }

        stage.addEventListener('mousemove', (e) => {
            const rect = core.getBoundingClientRect();
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            
            // Check distance to text center
            const textCenterX = rect.left + rect.width / 2;
            const textCenterY = rect.top + rect.height / 2;
            const dist = Math.sqrt(Math.pow(mouseX - textCenterX, 2) + Math.pow(mouseY - textCenterY, 2));
            
            if (dist < 150) {
                // Friction: Erase text slightly and spawn particles
                core.style.opacity = Math.max(0.1, 1 - (150 - dist) / 150);
                if (Math.random() > 0.7) {
                    createParticle(mouseX, mouseY);
                }
            } else {
                core.style.opacity = 1;
            }
        });
        
        animate();
    </script>

</html>
