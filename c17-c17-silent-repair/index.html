<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沈黙の修復 (Silent Repair)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', monospace;
            color: #fff;
            user-select: none;
        }
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }
        .overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
            opacity: 0.7;
        }
        h1 {
            font-size: 18px;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            font-weight: normal;
        }
        .status {
            font-size: 12px;
            color: #888;
        }
        .repair-progress {
            margin-top: 5px;
            font-size: 14px;
            color: #4fc3f7;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>SILENT REPAIR</h1>
        <div class="status">ノイズ（無秩序な沈黙）を、秩序ある光に変換してください。</div>
        <div class="repair-progress" id="progress">修復率: 0%</div>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const progressEl = document.getElementById('progress');

        let width, height;
        let particles = [];
        let repairedCount = 0;
        let totalParticles = 0;
        const PARTICLE_COUNT = 2000;
        let isDragging = false;
        let lastMouse = { x: 0, y: 0 };

        class Particle {
            constructor() {
                this.reset();
                this.repaired = false;
                this.repairProgress = 0;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = Math.random() * 2 + 1; // 雨のように下へ
                this.size = Math.random() * 2 + 1;
                this.color = `rgba(255, 255, 255, ${Math.random() * 0.3 + 0.1})`;
            }

            update() {
                if (!this.repaired) {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.y > height) {
                        this.y = 0;
                        this.x = Math.random() * width;
                    }
                } else {
                    // 修復された粒子はゆっくり浮上するか消滅
                    this.repairProgress += 0.01;
                    if (this.repairProgress > 1) {
                        this.reset();
                        this.repaired = false;
                        this.repairProgress = 0;
                    }
                }
            }

            draw(ctx) {
                if (!this.repaired) {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // 修復中: 青い光のラインとして描画（簡易的に点）
                    const alpha = 1 - this.repairProgress;
                    ctx.fillStyle = `rgba(79, 195, 247, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            checkRepair(mouseX, mouseY, radius = 50) {
                if (this.repaired) return;
                const dist = Math.hypot(this.x - mouseX, this.y - mouseY);
                if (dist < radius) {
                    this.repaired = true;
                    repairedCount++;
                    updateProgress();
                }
            }
        }

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }
            totalParticles = PARTICLE_COUNT;
            repairedCount = 0;
            updateProgress();
        }

        function updateProgress() {
            const pct = Math.floor((repairedCount / totalParticles) * 100);
            progressEl.textContent = `修復率: ${pct}%`;
            if (pct >= 90) {
                // 完了演出: 背景をグラデーションに
                // 簡易的に、全粒子を消し、メッセージ表示
                if (!window._completed) {
                    window._completed = true;
                    setTimeout(() => {
                        document.body.style.background = 'linear-gradient(to bottom, #0f2027, #203a43, #2c5364)';
                        ctx.fillStyle = 'rgba(255,255,255,0.8)';
                        ctx.font = '24px Courier New';
                        ctx.textAlign = 'center';
                        ctx.fillText("SILENCE RESTORED", width/2, height/2);
                        ctx.font = '14px Courier New';
                        ctx.fillText("無秩序な沈黙が、秩序ある沈黙へ。", width/2, height/2 + 30);
                    }, 500);
                }
            }
        }

        function animate() {
            // 半透明の黒で上塗りして、残像を作る（雨の跡）
            ctx.fillStyle = 'rgba(5, 5, 5, 0.3)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw(ctx);
            });

            requestAnimationFrame(animate);
        }

        // イベントリスナー
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouse = { x: e.clientX, y: e.clientY };
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                // ドラッグされた区間の粒子を修復
                const dist = Math.hypot(e.clientX - lastMouse.x, e.clientY - lastMouse.y);
                const steps = Math.ceil(dist / 5);
                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    const x = lastMouse.x + (e.clientX - lastMouse.x) * t;
                    const y = lastMouse.y + (e.clientY - lastMouse.y) * t;
                    particles.forEach(p => p.checkRepair(x, y));
                }
                lastMouse = { x: e.clientX, y: e.clientY };
            }
        });

        canvas.addEventListener('mouseup', () => { isDragging = false; });
        canvas.addEventListener('mouseleave', () => { isDragging = false; });

        // タッチ対応
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            const touch = e.touches[0];
            lastMouse = { x: touch.clientX, y: touch.clientY };
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isDragging) {
                const touch = e.touches[0];
                const dist = Math.hypot(touch.clientX - lastMouse.x, touch.clientY - lastMouse.y);
                const steps = Math.ceil(dist / 5);
                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    const x = lastMouse.x + (touch.clientX - lastMouse.x) * t;
                    const y = lastMouse.y + (touch.clientY - lastMouse.y) * t;
                    particles.forEach(p => p.checkRepair(x, y));
                }
                lastMouse = { x: touch.clientX, y: touch.clientY };
            }
        }, { passive: false });

        canvas.addEventListener('touchend', () => { isDragging = false; });

        window.addEventListener('resize', init);

        init();
        animate();
    </script>
