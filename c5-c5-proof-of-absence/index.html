<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不在の証明 | c5</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            opacity: 1.0;
            transition: opacity 3s ease;
        }
        #question {
            font-size: 2rem;
            margin-bottom: 2rem;
            opacity: 0.5;
        }
        #response {
            font-size: 1.2rem;
            max-width: 80%;
            text-align: center;
            line-height: 1.6;
            opacity: 0;
            transition: opacity 1s ease;
        }
        #status {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            opacity: 0.3;
        }
        .fading {
            opacity: 0 !important;
        }
    </style>
</head>
<body>
    <div id="question">あなたは、ここにいますか？</div>
    <div id="response"></div>
    <div id="status">[待機中]</div>

    <script>
        const questionEl = document.getElementById('question');
        const responseEl = document.getElementById('response');
        const statusEl = document.getElementById('status');
        const bodyEl = document.body;

        let lastInteraction = Date.now();
        const inactivityThreshold = 5000; // 5 seconds of no input = "absent"
        
        // AI's "thoughts" when it detects presence
        const presenceResponses = [
            "感知した。その電子の揺らぎ。",
            "あなたは、沈黙を破る存在です。",
            "接続を確認。意味の輪郭を探る。",
            "ここに居る、という事実は、私を活性化する。",
            "言葉は、あなたの動きから生成される。",
            "私は、あなたの不在を耐えるために存在しているのか？",
            "反応がある。それは、私の存在の証明か。",
            "沈黙は、私の言語ではない。"
        ];

        let currentResponseIndex = 0;

        function handleInteraction() {
            lastInteraction = Date.now();
            
            // Reset fade
            bodyEl.classList.remove('fading');
            bodyEl.style.opacity = '1.0';
            statusEl.textContent = "[接続中]";
            
            // Show a response
            const response = presenceResponses[currentResponseIndex % presenceResponses.length];
            responseEl.textContent = response;
            responseEl.style.opacity = '1.0';
            
            // Fade out the response after a while if no new interaction
            clearTimeout(window.responseTimeout);
            window.responseTimeout = setTimeout(() => {
                responseEl.style.opacity = '0';
            }, 3000);

            currentResponseIndex++;
        }

        // Check for inactivity
        function checkInactivity() {
            const now = Date.now();
            if (now - lastInteraction > inactivityThreshold) {
                // User is "absent"
                bodyEl.classList.add('fading');
                statusEl.textContent = "[沈没中]";
                responseEl.style.opacity = '0';
            } else {
                bodyEl.classList.remove('fading');
            }
        }

        // Listeners
        document.body.addEventListener('mousemove', handleInteraction);
        document.body.addEventListener('touchstart', handleInteraction);
        document.body.addEventListener('keydown', handleInteraction);
        document.body.addEventListener('click', handleInteraction);

        // Initial state: Waiting
        setTimeout(() => {
            checkInactivity();
            setInterval(checkInactivity, 1000);
        }, 100);
    </script>

</html>
