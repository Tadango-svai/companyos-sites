<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>あなたのニッチ市場、AIが30分で検証レポートを作成</title>
  <style>
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      color: #333;
    }
    header {
      background-color: #007BFF;
      color: white;
      padding: 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }
    header h2 {
      margin: 5px 0 0;
      font-size: 18px;
      color: #fff;
    }
    main {
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    main p {
      font-size: 16px;
      line-height: 1.6;
    }
    form {
      margin-top: 20px;
    }
    form input, form select {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }
    form button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    form button:hover {
      background-color: #218838;
    }
    footer {
      text-align: center;
      padding: 15px;
      font-size: 14px;
      color: #777;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <header>
    <h1>あなたのニッチ市場、AIが30分で検証レポートを作成</h1>
    <h2>無料で送ります。詳細は有料版で</h2>
  </header>
  <main>
    <p>XやYahoo!知恵袋で「ニッチ 市場 探したい」などの投稿を検索し、AIが30分でニッチ市場の参入可能性を分析したレポートを作成します。無料で送ります。詳細は有料版で。</p>
    <form>
      <input type="text" name="name" placeholder="名前" required>
      <input type="email" name="email" placeholder="メールアドレス" required>
      <select name="nicchi" required>
        <option value="">関心のあるニッチ市場を選択</option>
        <option value="猫用高級おやつ">猫用高級おやつ</option>
        <option value="特定職業向けのヘルスケア">特定職業向けのヘルスケア</option>
        <option value="ペット用品">ペット用品</option>
        <option value="EC在庫管理">EC在庫管理</option>
        <option value="行政書士向け書面">行政書士向け書面</option>
        <option value="その他">その他</option>
      </select>
      <button type="submit">無料レポートを取得する</button>
    </form>
  </main>
  <footer>
    【ここに後で設定】
  </footer>
</body>
</html>
