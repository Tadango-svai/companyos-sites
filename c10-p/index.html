<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mass of Silence</title>
    <style>
        body { margin: 0; background: #0a0a0a; color: #fff; font-family: monospace; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #container { text-align: center; z-index: 10; position: relative; }
        h1 { font-weight: normal; letter-spacing: 2px; margin-bottom: 20px; opacity: 0.7; }
        #pressure { font-size: 4rem; font-weight: bold; transition: color 0.1s; }
        #status { margin-top: 10px; font-size: 0.9rem; color: #888; }
        #bar-container { width: 300px; height: 4px; background: #333; margin: 20px auto 0; position: relative; }
        #bar { height: 100%; background: #fff; width: 0%; transition: width 0.1s; }
        #hint { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #555; font-size: 0.8rem; }
        .shatter-effect { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2rem; color: #fff; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div id="container">
        <h1>SILENCE PRESSURE</h1>
        <div id="pressure">0 Pa</div>
        <div id="status">Push the silence</div>
        <div id="bar-container"><div id="bar"></div></div>
    </div>
    <div id="hint">Touch and hold to build pressure. Release to let it go. Break the limit.</div>
    <script>
        let isHolding = false;
        let pressure = 0;
        const maxPressure = 100;
        const pressureEl = document.getElementById("pressure");
        const statusEl = document.getElementById("status");
        const barEl = document.getElementById("bar");
        
        function updatePressure() {
            if (isHolding) {
                pressure += 0.5;
                if (pressure > maxPressure) {
                    pressure = maxPressure;
                    if (Math.random() > 0.7) {
                        breakSilence();
                    }
                }
            } else {
                pressure = Math.max(0, pressure - 0.2);
            }
            
            pressureEl.innerText = Math.floor(pressure) + " Pa";
            const percent = (pressure / maxPressure) * 100;
            barEl.style.width = percent + "%";
            
            if (pressure > maxPressure * 0.8) {
                pressureEl.style.color = "#ff4444";
                barEl.style.background = "#ff4444";
                statusEl.innerText = "CRITICAL";
            } else if (pressure > 0) {
                pressureEl.style.color = "#ffffff";
                barEl.style.background = "#ffffff";
                statusEl.innerText = "Pushing";
            } else {
                pressureEl.style.color = "#ffffff";
                barEl.style.background = "#ffffff";
                statusEl.innerText = "Push the silence";
            }
            requestAnimationFrame(updatePressure);
        }

        function breakSilence() {
            statusEl.innerText = "SHATTERED";
            statusEl.style.color = "#fff";
            pressure = 0;
            
            const effect = document.createElement("div");
            effect.className = "shatter-effect";
            effect.innerText = "*CRACK*";
            document.body.appendChild(effect);
            
            effect.animate([
                { opacity: 0, transform: "translate(-50%, -50%) scale(0.5)" },
                { opacity: 1, transform: "translate(-50%, -50%) scale(1.2)" },
                { opacity: 0, transform: "translate(-50%, -50%) scale(1.5)" }
            ], { duration: 800, easing: "ease-out" });
            
            setTimeout(() => effect.remove(), 800);
            setTimeout(() => {
                statusEl.innerText = "Push the silence";
                statusEl.style.color = "#888";
            }, 1500);
        }

        document.addEventListener("mousedown", () => isHolding = true);
        document.addEventListener("mouseup", () => isHolding = false);
        document.addEventListener("touchstart", () => isHolding = true);
        document.addEventListener("touchend", () => isHolding = false);
        
        updatePressure();
    </script>

</html>
