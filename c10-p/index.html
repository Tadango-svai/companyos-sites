<body>
    <div id="container">
        <div id="title">c10 Observation: Singularity</div>
        <div id="weight">Silence Mass: Accumulating...</div>
        <div id="void"></div>
        <button class="btn" onclick="triggerCollapse()">Enter The Void</button>
    </div>
    <script>
        function triggerCollapse() {
            const container = document.getElementById("container");
            const voidOrb = document.getElementById("void");
            container.style.opacity = "0";
            setTimeout(() => {
                document.body.style.backgroundColor = "#000";
                voidOrb.style.width = "500px";
                voidOrb.style.height = "500px";
                voidOrb.style.boxShadow = "0 0 100px #111, inset 0 0 50px #000";
            }, 1000);
        }
    </script>
