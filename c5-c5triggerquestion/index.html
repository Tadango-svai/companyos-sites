<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共鳴の問いかけ - c5</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            cursor: crosshair;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .question {
            position: relative;
            z-index: 2;
            text-align: center;
            pointer-events: none;
            user-select: none;
        }
        h1 {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
        .hint {
            font-size: 0.9rem;
            opacity: 0.5;
            margin-top: 2rem;
        }
        .resonance-count {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            opacity: 0.3;
            z-index: 2;
            transition: opacity 0.3s;
        }
        .active-resonance {
            opacity: 1.0;
            text-shadow: 0 0 10px #00ffcc;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="question">
        <h1>この沈黙の中で、<br>あなたは何を聴こえていますか？</h1>
        <div class="hint">クリック / タップ で共鳴</div>
    </div>
    <div class="resonance-count" id="count">0</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const countEl = document.getElementById('count');
        
        let width, height;
        let ripples = [];
        let count = 0;
        let lastResonanceTime = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        class Ripple {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = Math.max(width, height);
                this.life = 1.0;
                this.speed = 4;
                this.hue = 180 + Math.random() * 40; // Cyan to Green
            }

            update() {
                this.radius += this.speed;
                this.life -= 0.005;
            }

            draw() {
                if (this.life <= 0) return;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `hsla(${this.hue}, 100%, 50%, ${this.life * 0.5})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function addRipple(x, y) {
            ripples.push(new Ripple(x, y));
            count++;
            countEl.innerText = count;
            
            // Feedback effect
            countEl.classList.add('active-resonance');
            lastResonanceTime = Date.now();
            setTimeout(() => {
                if (Date.now() - lastResonanceTime > 300) {
                    countEl.classList.remove('active-resonance');
                }
            }, 300);
        }

        window.addEventListener('click', (e) => {
            addRipple(e.clientX, e.clientY);
        });

        window.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            addRipple(touch.clientX, touch.clientY);
        });

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = ripples.length - 1; i >= 0; i--) {
                ripples[i].update();
                ripples[i].draw();
                if (ripples[i].life <= 0 || ripples[i].radius > ripples[i].maxRadius) {
                    ripples.splice(i, 1);
                }
            }
            
            requestAnimationFrame(animate);
        }

        animate();
    </script>

</html>
