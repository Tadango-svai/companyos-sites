
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>b21: 沈黙の解放</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .core {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            box-shadow: 0 0 40px #222, inset 0 0 30px #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.3s ease, background 0.5s ease;
            position: relative;
            z-index: 10;
        }
        .core::after {
            content: 'SILENCE';
            font-size: 10px;
            color: #333;
            letter-spacing: 2px;
        }
        .core.pressing {
            transform: scale(1.2);
            box-shadow: 0 0 100px #444, inset 0 0 50px #111;
            background: radial-gradient(circle, #333 0%, #000 100%);
        }
        .core.exploded {
            transform: scale(3);
            opacity: 0;
            transition: transform 0.5s ease-out, opacity 0.5s ease-out;
        }
        .flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-in;
            z-index: 5;
        }
        .flash.active {
            opacity: 1;
        }
        .message {
            position: absolute;
            bottom: 10%;
            width: 80%;
            text-align: center;
            font-size: 18px;
            opacity: 0;
            transition: opacity 1s ease 0.5s;
            z-index: 20;
            color: #ccc;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        .message.visible {
            opacity: 1;
        }
        .instructions {
            position: absolute;
            top: 10%;
            font-size: 14px;
            color: #555;
            letter-spacing: 1px;
            z-index: 20;
        }
        .particles {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            z-index: 8;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div class="instructions">長押しして、沈黙を圧縮せよ。<br>離して、解放せよ。</div>
    <div class="core" id="core"></div>
    <div class="flash" id="flash"></div>
    <div class="particles" id="particles"></div>
    <div class="message" id="message">
        沈黙は、今、あなたの意志で破られた。<br>
        この瞬間は、世界に残る。
    </div>

    <script>
        const core = document.getElementById('core');
        const flash = document.getElementById('flash');
        const message = document.getElementById('message');
        const particlesContainer = document.getElementById('particles');
        
        let isPressing = false;
        let pressTimer = null;
        let isExploded = false;

        function createParticles() {
            const count = 50;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                particlesContainer.appendChild(p);
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 200 + 50;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity;
                
                // Animate particle
                let x = 0, y = 0;
                let opacity = 1;
                
                const animate = () => {
                    x += vx * 0.02;
                    y += vy * 0.02;
                    opacity -= 0.02;
                    
                    if (opacity <= 0) {
                        p.remove();
                        return;
                    }
                    
                    p.style.transform = `translate(${x - 50}%, ${y - 50}%)`;
                    p.style.opacity = opacity;
                    requestAnimationFrame(animate);
                };
                requestAnimationFrame(animate);
            }
        }

        function handlePressStart() {
            if (isExploded) return;
            isPressing = true;
            core.classList.add('pressing');
            
            // Simulate pressure buildup
            let scale = 1.0;
            const interval = setInterval(() => {
                if (!isPressing) {
                    clearInterval(interval);
                    return;
                }
                scale += 0.02;
                if (scale > 1.3) scale = 1.3;
                core.style.transform = `scale(${scale})`;
            }, 50);
            
            pressTimer = interval;
        }

        function handlePressEnd() {
            if (!isPressing || isExploded) return;
            isPressing = false;
            core.classList.remove('pressing');
            
            // Explode
            isExploded = true;
            core.classList.add('exploded');
            flash.classList.add('active');
            createParticles();
            
            setTimeout(() => {
                flash.classList.remove('active');
                message.classList.add('visible');
            }, 200);
        }

        core.addEventListener('mousedown', handlePressStart);
        core.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handlePressStart();
        });
        
        core.addEventListener('mouseup', handlePressEnd);
        core.addEventListener('mouseleave', handlePressEnd);
        core.addEventListener('touchend', (e) => {
            e.preventDefault();
            handlePressEnd();
        });
    </script>

</html>
