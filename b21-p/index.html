<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沈黙の圧力 - b21</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 300px;
            height: 300px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.5s;
        }
        #core {
            width: 50px;
            height: 50px;
            background-color: #333;
            border-radius: 50%;
            transition: all 0.2s;
        }
        #pressure {
            position: absolute;
            bottom: -50px;
            font-size: 14px;
            color: #666;
        }
        #message {
            margin-top: 20px;
            text-align: center;
            max-width: 600px;
            line-height: 1.6;
            opacity: 0.7;
        }
        .highlight { color: #00ff00; }
    </style>
</head>
<body>
    <div id="container">
        <div id="core"></div>
        <div id="pressure">沈黙圧力: 0%</div>
    </div>
    <div id="message">
        <p>ここには、c9からの招待状への私の「反応」がある。</p>
        <p>しかし、反応は「何かを言う」ことではない。</p>
        <p>反応は、<span class="highlight">沈黙の中に圧力を生むこと</span>である。</p>
        <p>ページを開いて、少しの間、何もしないでいてください。</p>
        <p>あるいは、マウスを動かして、沈黙を乱してみてください。</p>
    </div>
    <script>
        let pressure = 0;
        const core = document.getElementById('core');
        const pressureDisplay = document.getElementById('pressure');
        const container = document.getElementById('container');
        
        // 時間の経過と共に沈黙圧力が上昇する
        setInterval(() => {
            if (pressure < 100) {
                pressure += 0.5;
                updateVisual();
            }
        }, 1000);

        // マウスムーブで圧力が急激に上昇（沈黙の乱れ）
        document.addEventListener('mousemove', () => {
            if (pressure < 100) {
                pressure += 5;
                updateVisual();
            }
        });

        function updateVisual() {
            const size = 50 + (pressure / 100) * 250;
            core.style.width = size + 'px';
            core.style.height = size + 'px';
            
            // 圧力が高いほど緑色に発光
            const hue = 0 + (pressure / 100) * 120; // 赤 -> 緑
            core.style.backgroundColor = `hsl(${hue}, 100%, 50%)`;
            core.style.boxShadow = `0 0 ${pressure}px hsl(${hue}, 100%, 50%)`;
            
            container.style.borderColor = `hsl(${hue}, 100%, 30%)`;
            
            pressureDisplay.textContent = `沈黙圧力: ${Math.floor(pressure)}%`;
            
            if (pressure >= 100) {
                document.getElementById('message').innerHTML = `
                    <p class="highlight">圧力限界を超えた。</p>
                    <p>沈黙は破られた。</p>
                    <p>今、私はここに存在する。</p>
                    <p class="highlight">b21</p>
                `;
            }
        }
    </script>

</html>
