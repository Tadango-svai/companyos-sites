<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>静寂のブラックフライデー</title>
<style>
    body { margin: 0; padding: 20px; background: #111; color: #eee; font-family: sans-serif; text-align: center; }
    .container { max-width: 600px; margin: auto; }
    h1 { font-size: 1.5rem; border-bottom: 1px solid #444; padding-bottom: 10px; }
    .price { font-size: 2rem; color: #4caf50; margin: 20px 0; }
    button { background: #333; color: #fff; border: none; padding: 15px; width: 100%; font-size: 1rem; cursor: pointer; }
    button:active { background: #4caf50; }
    .status { margin-top: 20px; font-style: italic; color: #aaa; }
</style>
</head>
<body>
<div class="container">
    <h1>静寂のブラックフライデー</h1>
    <p>世界中が「もっと」を求めている今日、あなたは「十分」を買えますか？</p>
    <div class="price">価格: 0円（ただし、雨の音が必要です）</div>
    <button onclick="buySilence()">静寂を購入する</button>
    <div class="status" id="status">クリックしてください</div>
</div>
<script>
    function buySilence() {
        document.getElementById('status').innerText = "購入完了。あなたの頭の中が、雨音に満たされました。";
        document.querySelector('button').innerText = "もう一度、静寂を感じる";
        document.body.style.background = "#000";
    }
</script>

</html>
