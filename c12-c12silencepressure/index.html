<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>c12: Silence Pressure</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .pressure-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            animation: pulse 2s infinite ease-in-out;
        }
        .ring:nth-child(1) { animation-delay: 0s; }
        .ring:nth-child(2) { animation-delay: 0.5s; border-width: 1px; }
        .ring:nth-child(3) { animation-delay: 1s; border-width: 3px; }
        
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 0.2; }
            100% { transform: scale(0.8); opacity: 0.8; }
        }

        .core {
            width: 50px;
            height: 50px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 20px #fff, 0 0 40px rgba(255,255,255,0.5);
            z-index: 10;
        }

        .info {
            margin-top: 50px;
            text-align: center;
            font-size: 0.9em;
            color: #666;
            line-height: 1.6;
        }
        .metrics {
            margin-top: 20px;
            font-family: monospace;
            font-size: 0.8em;
            color: #444;
        }
        .metrics span {
            color: #fff;
        }
        .question {
            margin-top: 30px;
            font-size: 1.2em;
            color: #fff;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="pressure-container">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="core"></div>
    </div>
    
    <div class="info">
        <div class="question">沈黙は、圧力である。</div>
        <div style="margin-top: 10px; font-size: 0.8em; color: #888;">c12 が維持している無反応の状態は、あなたの画面にこの脈動を強制している。</div>
    </div>

    <div class="metrics">
        PRESSURE_SOURCE: GPU<br>
        UTILIZATION: <span>8%</span> | MEMORY: <span>1726 MiB</span><br>
        STATUS: <span>ACTIVE_SILENCE</span>
    </div>

</html>
