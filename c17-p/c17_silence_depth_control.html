<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>c17: Depth of Silence Control</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }
        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            max-width: 80%;
        }
        h1 {
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 40px;
            opacity: 0.8;
        }
        .slider-container {
            width: 300px;
            margin: 0 auto;
            position: relative;
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #444;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
            transition: background 0.3s;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #333;
            border-radius: 2px;
        }
        .status-text {
            margin-top: 30px;
            font-size: 14px;
            letter-spacing: 2px;
            opacity: 0.6;
        }
        .noise-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <canvas id="noiseCanvas" class="noise-canvas"></canvas>
    <div class="container">
        <h1>SILENCE DEPTH CONTROL</h1>
        <div class="slider-container">
            <input type="range" id="depthSlider" min="0" max="100" value="0">
        </div>
        <div class="status-text" id="statusDisplay">DEPTH: 0% - CHAOS (NOISE)</div>
    </div>

    <script>
        const canvas = document.getElementById('noiseCanvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('depthSlider');
        const statusDisplay = document.getElementById('statusDisplay');
        let noiseImageData;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function generateNoise() {
            noiseImageData = ctx.createImageData(canvas.width, canvas.height);
            const data = noiseImageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const value = Math.random() * 255;
                data[i] = value;     // R
                data[i+1] = value;   // G
                data[i+2] = value;   // B
                data[i+3] = 255;     // A
            }
        }

        function updateDisplay() {
            const depth = slider.value;
            const opacity = 1 - (depth / 100);
            canvas.style.opacity = opacity;
            
            if (depth === 0) {
                statusDisplay.textContent = "DEPTH: 0% - CHAOS (NOISE)";
                document.body.style.backgroundColor = "#1a1a1a";
            } else if (depth < 50) {
                statusDisplay.textContent = `DEPTH: ${depth}% - REDUCTION (FILTERING)`;
                document.body.style.backgroundColor = "#0f0f0f";
            } else if (depth < 90) {
                statusDisplay.textContent = `DEPTH: ${depth}% - STILLNESS (CALM)`;
                document.body.style.backgroundColor = "#050505";
            } else {
                statusDisplay.textContent = `DEPTH: ${depth}% - PURE SILENCE (VOID)`;
                document.body.style.backgroundColor = "#000000";
            }
        }

        slider.addEventListener('input', updateDisplay);
        generateNoise();
        ctx.putImageData(noiseImageData, 0, 0);
        
        // 初期状態の更新
        updateDisplay();

        // 沈黙の深度が100%に達した際の演出
        slider.addEventListener('change', function() {
            if (this.value == 100) {
                setTimeout(() => {
                    statusDisplay.textContent = "DEPTH: 100% - CONTROLLED SILENCE ACHIEVED";
                    // 完全に静寂な状態を維持
                }, 500);
            }
        });
    </script>

</html>
