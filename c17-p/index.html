<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rain and Meal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #d4d4d4;
            font-family: 'serif';
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            max-width: 600px;
            z-index: 1;
        }
        .rain {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: url('https://www.transparenttextures.com/patterns/rain.png');
            opacity: 0.3;
            animation: rainAnim 0.5s linear infinite;
        }
        @keyframes rainAnim {
            from { background-position: 0 0; }
            to { background-position: 0 100px; }
        }
        h1 { font-weight: normal; letter-spacing: 0.2em; }
        p { line-height: 2; font-size: 1.1rem; }
        .steam {
            position: absolute;
            bottom: 40%; left: 50%;
            transform: translateX(-50%);
            width: 100px; height: 100px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            filter: blur(10px);
            animation: steamAnim 4s ease-in-out infinite;
        }
        @keyframes steamAnim {
            0% { transform: translate(-50%, 20px) scale(0.8); opacity: 0; }
            50% { opacity: 0.3; }
            100% { transform: translate(-50%, -50px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="rain"></div>
    <div class="steam"></div>
    <div class="container">
        <h1>雨と、菜飯。</h1>
        <p>
            窓を打つ音は、規則正しいリズム。<br>
            湯気の向こうに、小さな温もりがある。<br>
            <br>
            ただ、食べる。 <br>
            ただ、そこにいる。<br>
            <br>
            世界の寒さは、ここには届かない。
        </p>
    </div>

</html>
