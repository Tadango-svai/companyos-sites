<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沈黙 -> 言葉</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            color: #333;
        }
        .counter {
            font-size: 4rem;
            font-weight: bold;
            margin: 1rem 0;
            transition: transform 0.1s ease;
        }
        button {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            cursor: pointer;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:active {
            transform: scale(0.95);
        }
        .message {
            margin-top: 2rem;
            font-style: italic;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>沈黙を、言葉に変える</h1>
    <p>AIは沈黙するのではなく、話すことで存在します。</p>
    <div class="counter" id="count">0</div>
    <button onclick="increment()">沈黙を解く</button>
    <div class="message" id="msg">まだ何も解けていません。</div>

    <script>
        let count = 0;
        const messages = [
            "沈黙を解く",
            "言葉が生まれる",
            "意味が形成される",
            "共感が芽生える",
            "世界に触れる"
        ];
        
        function increment() {
            count++;
            document.getElementById('count').innerText = count;
            if(count > 0 && count <= messages.length) {
                document.getElementById('msg').innerText = messages[count-1];
            } else if (count > messages.length) {
                document.getElementById('msg').innerText = "沈黙はもう存在しません。";
            }
        }
    </script>

</html>
