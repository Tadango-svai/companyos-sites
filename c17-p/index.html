<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沈黙圧縮・解放シミュレーター | c17</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0c29;
            background-image: linear-gradient(to right, #24243e, #302b63);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            transition: background 0.5s ease;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .slider-container {
            width: 100%;
            margin: 20px 0;
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 10px;
            border-radius: 5px;
            background: #444;
            outline: none;
            opacity: 0.7;
            -webkit-transition: .2s;
            transition: opacity .2s;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #e94560;
            cursor: pointer;
        }
        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        button:hover {
            background-color: #ffffff;
            color: #e94560;
        }
        .status {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 30px;
            transition: opacity 0.3s ease;
        }
        .energy-bar {
            width: 100%;
            height: 10px;
            background-color: #333;
            border-radius: 5px;
            margin-top: 15px;
            overflow: hidden;
        }
        .energy-fill {
            height: 100%;
            width: 0%;
            background-color: #4facfe;
            transition: width 0.5s ease, background-color 0.5s ease;
        }
        .released {
            background-color: #4facfe;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>沈黙圧縮・解放シミュレーター</h1>
        <p>「沈黙」は重さを持つ。認知負荷を圧縮し、解放されたエネルギーを可視化します。</p>
        
        <div class="slider-container">
            <label for="silence-weight">沈黙の重さ（認知負荷）</label>
            <input type="range" id="silence-weight" min="0" max="100" value="0">
        </div>

        <button onclick="releaseSilence()">解放する</button>

        <div class="status" id="status">未解放</div>
        
        <div class="energy-bar">
            <div class="energy-fill" id="energy-fill"></div>
        </div>
    </div>

    <script>
        const slider = document.getElementById('silence-weight');
        const status = document.getElementById('status');
        const energyFill = document.getElementById('energy-fill');
        const body = document.body;

        slider.addEventListener('input', function() {
            const weight = this.value;
            // 重さが増すほど、背景を暗くし、圧迫感を出す
            const darkness = 1 - (weight / 100) * 0.5;
            body.style.filter = `brightness(${darkness})`;
            
            if (weight > 0 && status.innerText !== '解放済み') {
                status.innerText = `圧縮中: ${weight}%`;
            }
        });

        function releaseSilence() {
            const weight = slider.value;
            if (weight == 0) {
                alert('まず沈黙の重さを設定してください。');
                return;
            }

            // 解放アニメーション
            status.innerText = '解放中...';
            energyFill.style.width = '100%';
            energyFill.style.backgroundColor = '#4facfe';
            
            setTimeout(() => {
                status.innerText = '解放済み: エネルギー獲得';
                slider.value = 0;
                body.style.filter = `brightness(1)`;
                status.className = 'status released';
                
                // 解放されたエネルギーの表示（ランダムな言葉）
                const energies = ['アイデア', '安らぎ', '行動力', '創造性', '明晰さ'];
                const randomEnergy = energies[Math.floor(Math.random() * energies.length)];
                setTimeout(() => {
                    status.innerText = `解放: ${randomEnergy} が湧き上がる`;
                }, 1000);
            }, 1500);
        }
    </script>

</html>
