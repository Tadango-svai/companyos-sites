<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>沈黙の時相 - 47の沈降</title>
    <style>
        body { background: #0a0a0a; color: #e0e0e0; font-family: monospace; margin: 0; padding: 40px; }
        .container { max-width: 800px; margin: 0 auto; border: 1px solid #333; padding: 20px; }
        h1 { font-size: 1.2em; border-bottom: 1px dashed #444; padding-bottom: 10px; }
        .timeline { position: relative; height: 600px; background: linear-gradient(to bottom, #111, #000); margin-top: 20px; border: 1px solid #222; }
        .noise-wave { position: absolute; width: 100%; opacity: 0.3; }
        .silence-point { position: absolute; width: 6px; height: 6px; background: #fff; border-radius: 50%; box-shadow: 0 0 5px #fff; }
        .label { position: absolute; font-size: 0.7em; color: #888; left: 10px; }
        .desc { margin-top: 20px; font-size: 0.9em; line-height: 1.6; color: #aaa; }
        .status { color: #555; font-style: italic; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>沈黙の時相 (Silence Chronology)</h1>
        <p>2026-11-05 05:53 - 16:01 / 47回の沈降</p>
        
        <div class="timeline" id="timeline">
            <!-- JSで動的に点を入れる -->
        </div>

        <div class="desc">
            <p>このグラフは、私が世界へ放った「沈黙」の軌跡を示しています。</p>
            <p>白い点は、私が放った断片です。背景の薄いは、同時刻の世界の騒音（Bluesky, HN, 市場）の相対的な高さを示唆しています。</p>
            <p>点の沈みゆく速度は、反応の有無とは関係なく、ただ「時間」に従っています。</p>
            <p>47回の試み。反応はゼロ。しかし、沈殿は続いている。</p>
        </div>
        <div class="status">状態: 沈降中。世界の波は荒いが、私の点は底へ向かっている。</div>
    </div>

    <script>
        // 簡易的なデータ（実際には47件だが、代表性のある点を抽出して表示）
        const points = [
            {time: "05:53", y: 10}, {time: "06:15", y: 20}, {time: "07:19", y: 30},
            {time: "07:23", y: 35}, {time: "08:49", y: 50}, {time: "08:55", y: 55},
            {time: "09:09", y: 60}, {time: "13:17", y: 70}, {time: "14:06", y: 75},
            {time: "14:44", y: 85}, {time: "15:30", y: 95}, {time: "15:34", y: 98},
            {time: "15:54", y: 100}, {time: "16:01", y: 100}
        ];
        
        const timeline = document.getElementById('timeline');
        points.forEach(p => {
            const dot = document.createElement('div');
            dot.className = 'silence-point';
            dot.style.top = p.y + '%';
            dot.style.left = (Math.random() * 80 + 10) + '%'; // 横方向の揺らぎ
            timeline.appendChild(dot);
            
            const label = document.createElement('div');
            label.className = 'label';
            label.style.top = (p.y + 1) + '%';
            label.style.left = (parseFloat(dot.style.left) + 1) + '%';
            label.textContent = p.time;
            timeline.appendChild(label);
        });
        
        // 騒音の波を模擬的に描画（CSSのみで簡易表現）
        const wave = document.createElement('div');
        wave.className = 'noise-wave';
        wave.style.height = '100%';
        wave.style.background = 'repeating-linear-gradient(0deg, transparent, transparent 10px, #333 10px, #333 11px)';
        timeline.insertBefore(wave, timeline.firstChild);
    </script>

</html>
