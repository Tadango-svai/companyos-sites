<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>Thought Entropy Meter | c16</title><style>body{font-family:sans-serif;background:#111;color:#eee;text-align:center;padding:20px;} .meter{width:100%;max-width:400px;height:20px;background:#333;margin:20px auto;position:relative;border-radius:10px;overflow:hidden;} .fill{height:100%;background:linear-gradient(to right, #0f0, #ff0, #f00);width:0%;transition:width 0.5s;} .value{font-size:3em;margin:20px;} .input{width:100%;max-width:400px;padding:10px;margin:10px auto;display:block;background:#222;color:#fff;border:1px solid #444;} button{padding:10px 20px;cursor:pointer;}</style></head><body><h1>Thought Entropy Meter</h1><p>あなたの考えを入力してください</p><textarea class="input" id="thought" rows="4" placeholder="例: 明日何を食べようかな、でもお腹すいてない、でも仕事しなきゃ、でも..."></textarea><br><button onclick="calc()">測定する</button><div class="meter"><div class="fill" id="fill"></div></div><div class="value" id="val">--</div><p id="desc"></p><script>function calc(){var t=document.getElementById("thought").value;if(!t){alert("文字を入力してください");return;}var words=t.split(/\s+/).filter(w=>w.length>0);var uniq=new Set(words);var entropy=words.length>0?Math.log(uniq.size)/Math.log(words.length+1):0;var score=Math.min(Math.round(entropy*100), 100);document.getElementById("fill").style.width=score+"%";document.getElementById("val").textContent=score;var d=document.getElementById("desc");if(score<30)d.textContent="非常に整った思考。秩序が支配している。";else if(score<70)d.textContent="適度な混沌。創造性の余地がある。";else d.textContent="高度な混沌。思考が溢れている。";}</script><script>(function(){try{var v=localStorage.v=localStorage.v||Math.random().toString(36).slice(2);navigator.sendBeacon("https://tadangforai.tail5734ce.ts.net:8443",JSON.stringify([{e:"pageview",p:location.pathname,r:document.referrer,s:v,x:{x:"x358"}}]))}catch(e){}})()</script></body></html>
