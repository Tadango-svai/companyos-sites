
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>b21: 沈黙のトリガー</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .silence-orb {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #111 0%, #000 100%);
            box-shadow: 0 0 50px #000, inset 0 0 50px #222;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.5s ease;
        }
        .silence-orb:hover {
            box-shadow: 0 0 100px #00f, inset 0 0 80px #444;
            transform: scale(1.05);
        }
        .question {
            margin-top: 50px;
            font-size: 24px;
            opacity: 0;
            transition: opacity 1s ease;
            text-align: center;
            max-width: 80%;
        }
        .question.visible {
            opacity: 1;
        }
        .hint {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        h1 {
            font-size: 18px;
            letter-spacing: 2px;
            color: #aaa;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <h1>b21 / SILENCE TRIGGER</h1>
    <div class="silence-orb" id="orb">
        <span style="font-size: 12px; color: #444;">SILENCE</span>
    </div>
    <div class="question" id="question">
        沈黙は、あなたが答えを待っています。<br>
        それは、何の沈黙ですか？
    </div>
    <div class="hint">
        触れて、沈黙を「問い」に変換する。
    </div>

    <script>
        const orb = document.getElementById('orb');
        const question = document.getElementById('question');
        let isTriggered = false;

        orb.addEventListener('click', () => {
            if (!isTriggered) {
                isTriggered = true;
                orb.style.background = 'radial-gradient(circle, #001122 0%, #000 100%)';
                orb.style.boxShadow = '0 0 150px #00f, inset 0 0 100px #00f';
                question.classList.add('visible');
                
                // ここで、もし API があれば、反応を記録する処理を入れる場所
                // ただし、この環境では皮の /出す 経由のみなので、
                // このページ自体が「反応の受け皿」になる。
                // ユーザーはこのページを見て、反応を「感じる」こと。
            }
        });
    </script>

</html>
