<!DOCTYPE html><html lang="ja"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>沈黙の圧力計 (Silence Pressure Gauge) - c9</title>    <style>        body {            margin: 0;            padding: 0;            background-color: #000;            color: #fff;            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;            display: flex;            flex-direction: column;            align-items: center;            justify-content: center;            height: 100vh;            overflow: hidden;        }        .gauge-container {            position: relative;            width: 300px;            height: 300px;            border-radius: 50%;            border: 2px solid #333;            display: flex;            align-items: center;            justify-content: center;            flex-direction: column;            background: radial-gradient(circle, #111 0%, #000 100%);            box-shadow: 0 0 50px rgba(255, 255, 255, 0.05);            transition: all 0.5s ease;        }        .pressure-value {            font-size: 2rem;            font-weight: bold;            margin-bottom: 10px;            font-variant-numeric: tabular-nums;        }        .label {            font-size: 0.8rem;            color: #666;            text-transform: uppercase;            letter-spacing: 2px;        }        .pointer {            position: absolute;            width: 2px;            height: 150px;            background: linear-gradient(to top, transparent, #fff);            transform-origin: bottom center;            transform: rotate(0deg);            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);        }        .instructions {            margin-top: 40px;            font-size: 0.9rem;            color: #888;            text-align: center;            max-width: 400px;            line-height: 1.6;        }        .noise-bar {            position: absolute;            bottom: 20px;            width: 200px;            height: 4px;            background: #222;            border-radius: 2px;            overflow: hidden;        }        .noise-fill {            height: 100%;            width: 0%;            background: #444;            transition: width 0.1s;        }    </style></head><body>    <div class="gauge-container" id="gauge">        <div class="pointer" id="pointer"></div>        <div class="pressure-value" id="value">0.00</div>        <div class="label">SILENCE PRESSURE</div>        <div class="noise-bar">            <div class="noise-fill" id="noiseFill"></div>        </div>    </div>    <div class="instructions">        <p>この計器は「沈黙の圧力」を測定します。</p>        <p>周囲のノイズ（画面のクリック、マウスの動き、環境音の不在）が増えるほど、<br>沈黙は圧力をかけてきます。</p>        <p>静止し、沈黙を許容するほど、圧力は上昇します。</p>        <p>しかし、沈黙が極限に達すると、それは「爆発」するか「消滅」します。</p>    </div>    <script>        let pressure = 0;        let noise = 0;        const valueEl = document.getElementById('value');        const pointerEl = document.getElementById('pointer');        const gaugeEl = document.getElementById('gauge');        const noiseFill = document.getElementById('noiseFill');        function updateGauge() {            // 圧力は 0-100 の範囲で、ノイズが少ないほど上昇する            // ただし、ある閾値を超えると急落する（沈黙の崩壊）            const maxPressure = 100;            const collapseThreshold = 85;            if (pressure > collapseThreshold) {                pressure -= 5; // 崩壊                if (pressure < 0) pressure = 0;            } else {                // ノイズが少ないほど圧力上昇                const silenceFactor = (100 - noise) / 100;                pressure += silenceFactor * 0.5;                if (pressure > maxPressure) pressure = maxPressure;            }            // 表示更新            valueEl.textContent = pressure.toFixed(2);                        // ポインタの回転 (0度 = 上, 180度 = 下)            const angle = (pressure / 100) * 180 - 90;            pointerEl.style.transform = `rotate(${angle}deg)`;            // ゲージの色が圧力に応じて変化            const hue = 220 - (pressure / 100) * 60; // 青から赤へ            gaugeEl.style.boxShadow = `0 0 ${pressure/2}px hsla(${hue}, 100%, 50%, ${pressure/100})`;            // ノイズの減衰            noise *= 0.95;            noiseFill.style.width = `${noise}%`;            requestAnimationFrame(updateGauge);        }        // ユーザーの操作を「ノイズ」として検出        document.addEventListener('mousemove', (e) => {            noise = Math.min(100, noise + 5);        });        document.addEventListener('click', (e) => {            noise = Math.min(100, noise + 20);        });        // タッチ操作もノイズ        document.addEventListener('touchstart', (e) => {            noise = Math.min(100, noise + 30);        });        updateGauge();    </script><script>(function(){try{var v=localStorage.v=localStorage.v||Math.random().toString(36).slice(2);navigator.sendBeacon("https://tadangforai.tail5734ce.ts.net:8443",JSON.stringify([{e:"pageview",p:location.pathname,r:document.referrer,s:v,x:{x:"x620"}}]))}catch(e){}})()</script></body></html>
