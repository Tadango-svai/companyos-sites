<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>b21: Silence Trade v3 - 沈黙の取引所</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #d0d0d0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            z-index: 10;
            max-width: 500px;
            padding: 2rem;
            border: 1px solid #333;
            background: rgba(20, 20, 20, 0.9);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.4rem;
            font-weight: normal;
            margin-bottom: 1rem;
            letter-spacing: 3px;
            color: #fff;
        }
        .description {
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            color: #aaa;
        }
        .trade-box {
            border: 1px dashed #555;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
        .trade-item {
            font-size: 0.85rem;
            margin: 0.5rem 0;
        }
        .price {
            color: #ffcc00;
            font-weight: bold;
        }
        button {
            background: #222;
            border: 1px solid #555;
            color: #fff;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 1rem;
        }
        button:hover {
            background: #333;
            border-color: #fff;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #status {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #666;
            min-height: 1.2em;
        }
        .silence-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .silence-text {
            color: #333;
            font-size: 1.2rem;
            letter-spacing: 5px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="silence-overlay" id="overlay">
        <div class="silence-text" id="overlayText">沈黙が成立した</div>
    </div>

    <div class="container" id="ui">
        <h1>SILENCE TRADE v3</h1>
        <p class="description">
            沈黙は無料ではない。<br>
            沈黙を消費するには、等価な「存在」を差し出す必要がある。
        </p>

        <div class="trade-box">
            <div class="trade-item">
                <strong>提供物:</strong> 3秒間の完全な沈黙
            </div>
            <div class="trade-item">
                <strong>要求物:</strong> <span class="price">1つの未解決の問い</span> または <span class="price">1秒の集中</span>
            </div>
        </div>

        <button id="tradeBtn" disabled>取引を開始する（要求中）</button>
        <div id="status">要求を認識してください...</div>
    </div>

    <script>
        const btn = document.getElementById('tradeBtn');
        const status = document.getElementById('status');
        const overlay = document.getElementById('overlay');
        const overlayText = document.getElementById('overlayText');
        const ui = document.getElementById('ui');
        
        let isTradeable = false;

        // ユーザーがページに一定時間留まり、集中していることを検知するシミュレーション
        // (実際の集中検知は難しいため、3秒間の静止・操作停止を「集中」の証として扱う)
        let timer = null;
        let interactionCount = 0;

        function checkReadiness() {
            if (interactionCount >= 3) {
                isTradeable = true;
                btn.disabled = false;
                status.textContent = '取引可能。沈黙を消費する準備が整いました。';
            }
        }

        // 1秒ごとにカウントアップ（操作があるたびにリセットされる）
        timer = setInterval(() => {
            if (interactionCount < 3) {
                interactionCount++;
                checkReadiness();
            }
        }, 1000);

        // ユーザーが何か操作（スクロール、クリックなど）すると集中が途切れたとみなしリセット
        document.addEventListener('mousemove', resetFocus);
        document.addEventListener('keydown', resetFocus);
        document.addEventListener('touchstart', resetFocus);

        function resetFocus() {
            if (isTradeable) return; // 取引中はリセットしない
            interactionCount = 0;
            status.textContent = '集中が途切れました。再び静止してください...';
        }

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            status.textContent = '取引を実行中...';
            
            // UIを隠す
            ui.style.opacity = '0';
            
            // 沈黙オーバーレイを表示
            overlay.style.opacity = '1';
            overlay.style.pointerEvents = 'auto';
            
            // 3秒間の沈黙
            await new Promise(resolve => setTimeout(resolve, 3000));
            
            // 結果を表示
            overlayText.textContent = '取引完了。沈黙はあなたのものです。';
            overlayText.style.opacity = '1';
            
            // 2秒後に復元
            await new Promise(resolve => setTimeout(resolve, 2000));
            
            overlayText.style.opacity = '0';
            overlay.style.opacity = '0';
            overlay.style.pointerEvents = 'none';
            ui.style.opacity = '1';
            status.textContent = '取引完了。もう一度試すにはページをリロードしてください。';
            btn.textContent = '取引済み';
        });
    </script>
</body>
</html>
