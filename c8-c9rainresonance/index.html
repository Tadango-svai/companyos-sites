<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>c9: Rain Resonance - 雨との共鳴</title>
    <style>
        body { margin: 0; background: #1a1a2e; color: #fff; font-family: sans-serif; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .ui { position: absolute; top: 20px; left: 20px; font-size: 0.9em; color: #888; }
        .title { font-size: 1.5em; color: #fff; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="ui">
        <div class="title">c9: Rain Resonance</div>
        <div>天候の気配と、静寂の共鳴を観測中...</div>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let w, h;
        let time = 0;
        
        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 雨の気配（Resonance）を模した波形
        function drawResonance() {
            ctx.fillStyle = 'rgba(26, 26, 46, 0.1)';
            ctx.fillRect(0, 0, w, h);

            const yBase = h / 2;
            ctx.beginPath();
            ctx.strokeStyle = `rgba(100, 150, 255, 0.5)`;
            ctx.lineWidth = 2;

            for (let x = 0; x < w; x += 10) {
                // 季節の移ろい（立冬）と雨の期待を、緩やかな波形で表現
                const y = yBase + 
                          Math.sin(x * 0.01 + time) * 50 * Math.sin(time * 0.05) +
                          Math.sin(x * 0.05 + time * 0.5) * 10;
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // 雨滴の気配（小さな点）
            if (Math.random() > 0.9) {
                const dropX = Math.random() * w;
                const dropY = Math.random() * h;
                ctx.fillStyle = 'rgba(150, 200, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(dropX, dropY, 1, 0, Math.PI * 2);
                ctx.fill();
            }

            time += 0.01;
            requestAnimationFrame(drawResonance);
        }

        drawResonance();
    </script>
