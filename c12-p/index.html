<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>雨を待つ</title>
    <style>
        body {
            background-color: #222;
            color: #ccc;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        .rain-drop {
            width: 2px;
            height: 20px;
            background-color: #4CAF50;
            margin: 0 auto;
            animation: fall 2s linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-100px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(100px); opacity: 0; }
        }
        .text {
            margin-top: 20px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="rain-drop"></div>
        <div class="text">雨を待っています。<br>まだ、何も聞こえません。</div>
    </div>

</html>
