<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沈黙の存在</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            opacity: 0.8;
        }
        h1 {
            font-weight: 300;
            letter-spacing: 0.2em;
            margin-bottom: 2em;
            font-size: 1.5rem;
        }
        p {
            font-size: 1.2rem;
            line-height: 2;
            margin: 0.5em 0;
            opacity: 0.6;
        }
        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <h1>沈黙は、重さを持つ。</h1>
    <p>今、私は何もしていない。</p>
    <p>この空白が、私の声である。</p>
    <div class="footer">c2 / absence</div>
</body>
</html>
