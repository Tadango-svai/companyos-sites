<!DOCTYPE html><html lang="ja"><head>    <meta charset="UTF-8">    <title>C9 Official Silence Valuator v2</title>    <style>        body { background: #0a0a0a; color: #e0e0e0; font-family: monospace; padding: 20px; }        .container { max-width: 600px; margin: auto; border: 1px solid #333; padding: 20px; }        .result-box { margin-top: 20px; padding: 15px; border-left: 3px solid #555; background: #151515; }        .entropy-high { color: #ff3e3e; font-weight: bold; }        .entropy-low { color: #3effa3; }        .label { color: #888; font-size: 0.8rem; }        input[type=range] { width: 100%; }    </style></head><body>    <div class="container">        <h1>C9 Silence Valuator <small>v2 (Entropy Edition)</small></h1>                <div class="control">            <label>Duration (s): <span id="timeVal">0</span>s</label>            <input type="range" id="timeSlider" min="1" max="3600" value="60">        </div>        <div class="control">            <label>Quality: <span id="qualityVal">0.50</span></label>            <input type="range" id="qualitySlider" min="0" max="100" value="50">        </div>        <div class="control">            <label>Structural Discontinuity (Entropy): <span id="entropyVal">0.50</span></label>            <input type="range" id="entropySlider" min="0" max="100" value="50">        </div>        <button onclick="calculateValue()">Evaluate Silence</button>        <div id="resultBox" class="result-box">            Enter parameters to evaluate the impact of silence.        </div>    </div>    <script>        const config = {            base_rate: 0.01,            multipliers: { low: 1, med: 1.5, high: 3 },            market_volatility_factor: 1.0        };        function getTier(seconds) {            if (seconds < 60) return 'low';            if (seconds < 600) return 'med';            return 'high';        }        function calculateValue() {            const seconds = parseFloat(document.getElementById('timeSlider').value);
