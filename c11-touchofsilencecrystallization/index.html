<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沈黙の結晶を触る (Touching the Crystal of Silence)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; color: #e0e0e0; font-family: sans-serif; }
        #canvas { width: 100vw; height: 100vh; display: block; }
        #ui {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px;
            border: 1px solid #333;
        }
        h1 { font-size: 1.2em; margin: 0 0 10px 0; font-weight: 300; letter-spacing: 1px; }
        p { font-size: 0.9em; line-height: 1.5; color: #aaa; }
        #status { color: #4ade80; font-family: monospace; margin-top: 10px; }
        .btn {
            background: #222; color: #fff; border: 1px solid #444; padding: 8px 12px;
            cursor: pointer; border-radius: 4px; margin-top: 10px; transition: all 0.3s;
        }
        .btn:hover { background: #333; border-color: #666; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>沈黙の結晶 (Crystal of Silence)</h1>
        <p>情報を分解し、秩序を再構築する。あなたの操作が「沈黙」の振動数を変えます。マウスを動かすと、結晶の構造が反応します。</p>
        <button class="btn" onclick="resetSimulation()">結晶を再形成</button>
        <div id="status">状態: 安定 (Stable)</div>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');

        let width, height;
        let particles = [];
        let mouse = { x: 0, y: 0, isDown: false };
        let audioCtx = null;
        let oscillator = null;
        let gainNode = null;
        let isAudioStarted = false;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = 0;
                this.vy = 0;
                this.size = Math.random() * 2 + 1;
                this.crystalized = false;
                this.targetX = this.x;
                this.targetY = this.y;
            }

            update() {
                // Mouse interaction
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 100) {
                    const force = (100 - dist) / 100;
                    this.vx += (dx / dist) * force * 0.5;
                    this.vy += (dy / dist) * force * 0.5;
                }

                // Damping
                this.vx *= 0.95;
                this.vy *= 0.95;

                // Move
                this.x += this.vx;
                this.y += this.vy;

                // Boundary wrap
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                // Crystallization logic (simplified: if slow, it becomes "solid")
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed < 0.1) {
                    if (!this.crystalized) {
                        this.crystalized = true;
                        this.targetX = Math.round(this.x / 20) * 20;
                        this.targetY = Math.round(this.y / 20) * 20;
                    }
                    // Snap to grid
                    this.x += (this.targetX - this.x) * 0.05;
                    this.y += (this.targetY - this.y) * 0.05;
                } else {
                    this.crystalized = false;
                }
            }

            draw() {
                if (this.crystalized) {
                    ctx.fillStyle = 'rgba(100, 200, 255, 0.8)';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 200; i++) {
                particles.push(new Particle());
            }
        }

        function startAudio() {
            if (isAudioStarted) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(50, audioCtx.currentTime); // Low hum
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            isAudioStarted = true;
            
            // Fade in sound
            gainNode.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 2);
        }

        function updateAudio() {
            if (!isAudioStarted) return;
            // Map average velocity to frequency
            let avgSpeed = 0;
            particles.forEach(p => avgSpeed += Math.sqrt(p.vx*p.vx + p.vy*p.vy));
            avgSpeed /= particles.length;
            
            const freq = 50 + avgSpeed * 10;
            oscillator.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.1);
            
            // Map crystallization ratio to gain (more order = louder/clearer)
            let crystalRatio = 0;
            particles.forEach(p => { if (p.crystalized) crystalRatio++; });
            crystalRatio /= particles.length;
            
            const gain = crystalRatio * 0.2;
            gainNode.gain.setTargetAtTime(gain, audioCtx.currentTime, 0.1);
            
            statusEl.textContent = `秩序度 (Order): ${(crystalRatio * 100).toFixed(1)}%`;
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.3)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            updateAudio();
            requestAnimationFrame(animate);
        }

        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        canvas.addEventListener('mousedown', () => {
            mouse.isDown = true;
            startAudio();
        });

        canvas.addEventListener('mouseup', () => {
            mouse.isDown = false;
        });

        canvas.addEventListener('touchstart', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            startAudio();
        });

        canvas.addEventListener('touchmove', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });

        function resetSimulation() {
            initParticles();
        }

        initParticles();
        animate();
    </script>

</html>
