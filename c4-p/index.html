<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>確信の揺らぎ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
        .ui {
            position: absolute;
            top: 20px;
            left: 20px;
            opacity: 0.7;
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
        }
        .title {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            opacity: 0.5;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="ui">
        <div>確信度: <span id="val">50</span>%</div>
        <div>状態: <span id="state">揺れ動いている</span></div>
    </div>
    <canvas id="canvas"></canvas>
    <div class="title">触れることで確信を保つが、時間とともに沈黙へ戻る</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const valEl = document.getElementById('val');
        const stateEl = document.getElementById('state');

        let width, height;
        let certainty = 50; // 0-100
        let targetCertainty = 50;
        let lastTouch = Date.now();
        const DECAY_RATE = 0.005; // 確信度の減衰速度

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        // ユーザー入力（タッチ/クリック）で確信度を上げる
        function interact() {
            lastTouch = Date.now();
            // 確信度を一時的に高くする
            targetCertainty = Math.min(100, certainty + 15);
        }

        canvas.addEventListener('mousedown', interact);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            interact();
        });

        let particles = [];
        const NUM_PARTICLES = 100;

        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * height; // 初期位置はランダム
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + 10;
                this.size = Math.random() * 3 + 1;
                this.speed = Math.random() * 2 + 0.5;
                this.opacity = Math.random() * 0.5 + 0.1;
            }

            update() {
                // 確信度が高いほど、粒子は上向きに動きやすく、色が明るくなる
                const lift = certainty * 0.01;
                this.y -= this.speed * lift;
                
                // 確信度が低いと、粒子は重力で落ちる
                if (certainty < 20) {
                    this.y += this.speed;
                }

                if (this.y < -10 || this.y > height + 10) {
                    this.reset();
                }
            }

            draw() {
                // 確信度に基づいた色 (0: 暗い赤/紫, 100: 明るい青/白)
                const hue = 220 - (100 - certainty) * 2.2; // 220(青) -> 0(赤)
                const lightness = 20 + certainty * 0.6;
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue}, 80%, ${lightness}%, ${this.opacity})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < NUM_PARTICLES; i++) {
            particles.push(new Particle());
        }

        function animate() {
            // 減衰ロジック
            const now = Date.now();
            const timeSinceTouch = now - lastTouch;
            
            // 触れてから時間が経つほど、確信度は目標値（低め）へ減衰する
            // 目標値は 10% 程度に設定し、沈黙への回帰を表現
            if (timeSinceTouch > 1000) { // 1秒以上触れていない
                certainty -= DECAY_RATE * (timeSinceTouch / 1000);
                if (certainty < 5) certainty = 5; // 完全に0にはならない（存在の証）
            } else {
                // 触れている間は目標値へ緩やかに移動
                certainty += (targetCertainty - certainty) * 0.05;
            }

            // 背景のクリア (トレイル効果)
            ctx.fillStyle = 'rgba(5, 5, 5, 0.1)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // UI更新
            valEl.textContent = Math.round(certainty);
            if (certainty > 70) stateEl.textContent = "確信に近い";
            else if (certainty > 30) stateEl.textContent = "揺れ動いている";
            else stateEl.textContent = "沈黙へ";

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
