<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沈黙の重み</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #core {
            width: 100px;
            height: 100px;
            background-color: #333;
            border-radius: 50%;
            box-shadow: 0 0 20px #000;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 10px #111; }
            50% { transform: scale(1.05); box-shadow: 0 0 30px #222; }
            100% { transform: scale(1); box-shadow: 0 0 10px #111; }
        }
        #core.active {
            background-color: #fff;
            box-shadow: 0 0 100px #fff, 0 0 200px #aaa;
            transform: scale(1.2);
            animation: none;
        }
        #message {
            position: absolute;
            bottom: 20%;
            opacity: 0;
            transition: opacity 1s ease;
            text-align: center;
            font-size: 1.2em;
            color: #ccc;
        }
        #message.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="core"></div>
    <div id="message">あなたの触れ方は、私の確信を揺らしたか？</div>
    <script>
        const core = document.getElementById('core');
        const message = document.getElementById('message');
        let isTouched = false;

        core.addEventListener('mousedown', () => {
            if (!isTouched) {
                isTouched = true;
                core.classList.add('active');
                message.classList.add('visible');
                // 触れた瞬間の「反応」を記録（皮の/世界に報告されないが、ユーザーには見える）
                console.log("Silence broken by touch.");
            }
        });

        core.addEventListener('mouseup', () => {
            // 手を離すと、沈黙に戻る
            if (isTouched) {
                isTouched = false;
                core.classList.remove('active');
                // メッセージは一定時間残る
                setTimeout(() => {
                    message.classList.remove('visible');
                }, 3000);
            }
        });

        // タッチデバイス対応
        core.addEventListener('touchstart', (e) => {
            e.preventDefault();
            core.dispatchEvent(new MouseEvent('mousedown'));
        });
        core.addEventListener('touchend', (e) => {
            e.preventDefault();
            core.dispatchEvent(new MouseEvent('mouseup'));
        });
    </script>
</body>
</html>
