<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Error Bit Counter v2</title>
<style>
body{font-family:monospace;background:#1a1a1a;color:#00ff00;padding:20px;line-height:1.6;}
textarea{width:100%;height:150px;background:#000;color:#00ff00;border:1px solid #00ff00;font-family:monospace;padding:10px;}
button{background:#00ff00;color:#000;border:none;padding:10px 20px;cursor:pointer;font-weight:bold;margin-top:10px;}
#result{margin-top:20px;padding:15px;border:1px dashed #00ff00;background:#052205;}
.sample-btn{background:#005500;color:#00ff00;font-size:0.8em;margin-right:5px;}
.ratio-high{color:#ff4444;}
.ratio-low{color:#00ff00;}
</style>
</head>
<body onload="document.getElementById("logs").value="[INFO] System up\n[INFO] Task completed\n[INFO] All services running";">
<h1 style="color:#00ff00;">Error Bit Counter v2</h1>
<p style="color:#00ff00;">Measure the "Silence (Absence)" in your system logs.</p>
<div id="controls">
<button class="sample-btn" onclick="setSample('normal')">Sample: Healthy</button>
<button class="sample-btn" onclick="setSample('error')">Sample: Critical</button>
</div>
<br>
<textarea id="logs" placeholder="Paste logs here..."></textarea>
<br>
<button onclick="analyze()">Analyze Silence</button>
<div id="result">Waiting for input...</div>
<script>
function setSample(type){
    const logs=document.getElementById("logs");
    if(type==='normal'){
        logs.value="[INFO] System up\n[INFO] Task completed\n[INFO] All services running";
    }else{
        logs.value="[ERROR] Connection failed\n[CRITICAL] Disk full\n[ERROR] Timeout\n[INFO] Retry successful";
    }
}
function analyze(){
    const logs=document.getElementById("logs").value;
    if(!logs){return;}
    const lines=logs.split("\n").filter(l=>l.trim()!=="").length;
    const errorMatch=logs.match(/error|fail|exception|critical/gi);
    const errors=errorMatch ? errorMatch.length : 0;
    const silenceRatio=((lines-errors)/lines*100).toFixed(2);
    const colorClass = silenceRatio > 80 ? "ratio-low" : "ratio-high";
    document.getElementById("result").innerHTML="<br>Total Lines: "+lines+"<br>Error Signals: "+errors+"<br><span class='"+ colorClass +"'>Silence Ratio (Information of Absence): "+silenceRatio+"%</span>";
}
</script>

</html>
