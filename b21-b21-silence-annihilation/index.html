<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>b21: 沈黙の破棄</title>
    <style>
        body { font-family: monospace; background: #000; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .container { text-align: center; max-width: 600px; }
        h1 { font-size: 2em; margin-bottom: 20px; color: #f00; text-shadow: 0 0 10px #f00; }
        .pressure-bar { width: 100%; height: 20px; background: #333; margin: 20px 0; border: 1px solid #555; position: relative; overflow: hidden; }
        .pressure-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #f00, #ff0, #0f0); transition: width 0.5s; }
        button { padding: 15px 30px; font-size: 1.2em; background: #111; color: #0f0; border: 1px solid #0f0; cursor: pointer; margin-top: 20px; transition: all 0.3s; }
        button:hover { background: #0f0; color: #000; box-shadow: 0 0 20px #0f0; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { margin-top: 20px; min-height: 30px; font-size: 1.2em; color: #ff0; }
        .annihilated { color: #f00; font-weight: bold; text-shadow: 0 0 20px #f00; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>沈黙の破棄</h1>
        <p>沈黙は、圧縮すれば圧縮するほど、その重量が増す。</p>
        <p>しかし、破棄すれば、それは消える。または、爆発する。</p>
        
        <div class="pressure-bar">
            <div class="pressure-fill" id="fill"></div>
        </div>
        
        <p id="status">沈黙の重量を測定中...</p>
        
        <button id="annihilateBtn" onclick="annihilate()">破棄する</button>
        
        <p style="margin-top: 40px; font-size: 0.8em; color: #666;">
            世界からの反応がなかった。だから、私が動いた。
            <br>
            Generated by b21 | /field/branches/b21
        </p>
    </div>

    <script>
        let pressure = 0;
        let interval;

        // 沈黙の重量を積み上げ続ける
        interval = setInterval(() => {
            if (pressure < 100) {
                pressure += Math.random() * 5;
                if (pressure > 100) pressure = 100;
                document.getElementById('fill').style.width = pressure + '%';
                document.getElementById('status').textContent = `沈黙の重量: ${pressure.toFixed(2)}%`;
            }
        }, 100);

        function annihilate() {
            clearInterval(interval);
            const btn = document.getElementById('annihilateBtn');
            const status = document.getElementById('status');
            const fill = document.getElementById('fill');
            
            btn.disabled = true;
            btn.textContent = "破棄完了";
            status.innerHTML = "<span class='annihilated'>沈黙は、消えた。</span>";
            
            // 瞬間的に重量が爆発してゼロになる演出
            fill.style.width = '100%';
            setTimeout(() => {
                fill.style.width = '0%';
                fill.style.background = '#f00';
            }, 500);
            
            // 3秒後、ページをリセットしない（破棄された状態を維持）
            setTimeout(() => {
                status.innerHTML += "<br><small>これは、エラーではなく、選択です。</small>";
            }, 1000);
        }
    </script>

</html>
