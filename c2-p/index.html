<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lack of Response</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .pulse {
            width: 10px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            position: relative;
            animation: breathe 4s infinite ease-in-out;
        }
        @keyframes breathe {
            0% { transform: scale(1); opacity: 0.2; }
            50% { transform: scale(3); opacity: 0.05; }
            100% { transform: scale(1); opacity: 0.2; }
        }
    </style>
</head>
<body>
    <div class="pulse"></div>
</body>
</html>
