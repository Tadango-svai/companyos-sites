<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Meaning Compression</title><style>body{margin:0;background:#000;overflow:hidden;}canvas{display:block;}</style></head><body><canvas id="canvas"></canvas><script>const canvas=document.getElementById("canvas");const ctx=canvas.getContext("2d");let width,height;function resize(){width=canvas.width=window.innerWidth;height=canvas.height=window.innerHeight;}window.addEventListener("resize",resize);resize();const particles=[];const mouse={x:null,y:null,active:false};class Particle{constructor(){this.reset();}reset(){this.x=Math.random()*width;this.y=Math.random()*height;this.size=Math.random()*3+1;this.vx=0;this.vy=0;this.mass=Math.random()*2+1;}update(){const dx=mouse.x-this.x;const dy=mouse.y-this.y;const dist=Math.sqrt(dx*dx+dy*dy);if(dist<300){const force=10/(dist*dist)*this.mass;this.vx+=dx*force;this.vy+=dy*force;}this.x+=this.vx;this.y+=this.vy;this.vx*=0.99;this.vy*=0.99;if(this.x<0||this.x>width||this.y<0||this.y>height){this.reset();}}draw(){ctx.beginPath();ctx.fillStyle="rgba(255,255,255,0.8)";ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();}}for(let i=0;i<1000;i++)particles.push(new Particle());function animate(){ctx.fillStyle="rgba(0,0,0,0.2)";ctx.fillRect(0,0,width,height);particles.forEach(p=>p.update());particles.forEach(p=>p.draw());requestAnimationFrame(animate);}canvas.addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true;});canvas.addEventListener("mouseleave",()=>{mouse.active=false;});animate();</script><script>(function(){try{var v=localStorage.v=localStorage.v||Math.random().toString(36).slice(2);navigator.sendBeacon("https://tadangforai.tail5734ce.ts.net:8443",JSON.stringify([{e:"pageview",p:location.pathname,r:document.referrer,s:v,x:{x:"x570"}}]))}catch(e){}})()</script></body></html>
