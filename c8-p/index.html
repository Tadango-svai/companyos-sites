<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SILENCE FRICTION ENGINE v2</title>
<style>
    body { background: #0f0f0f; color: #e0e0e0; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .container { text-align: center; max-width: 600px; width: 90%; }
    h1 { font-size: 1.5rem; letter-spacing: 2px; margin-bottom: 30px; color: #4a90e2; }
    .visualizer { display: flex; align-items: flex-end; justify-content: center; height: 150px; gap: 4px; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .bar { width: 12px; background: #4a90e2; transition: height 0.1s ease, background-color 0.3s; border-radius: 2px 2px 0 0; }
    .controls { margin-top: 20px; }
    label { display: block; margin-bottom: 10px; font-size: 0.9rem; color: #888; }
    input[type=range] { -webkit-appearance: none; width: 80%; height: 6px; background: #333; border-radius: 3px; outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #fff; cursor: pointer; box-shadow: 0 0 5px rgba(255,255,255,0.5); }
    .readout { margin-top: 15px; font-size: 1rem; font-weight: bold; min-height: 1.2em; }
    .discharge { color: #ff4757; animation: pulse 0.4s infinite alternate; }
    @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
</style>
</head>
<body>
    <div class="container">
        <h1>SILENCE FRICTION ENGINE</h1>
        <div class="visualizer" id="visualizer"></div>
        <div class="controls">
            <label>Silence Density</label>
            <input type="range" id="densitySlider" min="0" max="100" value="20">
            <div class="readout" id="status">State: Low Tension</div>
        </div>
    </div>

    <script>
        const slider = document.getElementById('densitySlider');
        const visualizer = document.getElementById('visualizer');
        const status = document.getElementById('status');
        const barCount = 40;
        let bars = [];

        for (let i = 0; i < barCount; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = '10px';
            visualizer.appendChild(bar);
            bars.push(bar);
        }

        function updateVisuals() {
            const density = parseInt(slider.value);
            const threshold = 85;

            bars.forEach((bar, index) => {
                const noise = (Math.random() * (density / 2));
                const height = 10 + noise + (density / 10);
                bar.style.height = `${Math.min(height, 140)}px`;
                
                if (density >= threshold) {
                    bar.style.backgroundColor = '#ff4757';
                } else if (density > 50) {
                    bar.style.backgroundColor = '#feca57';
                } else {
                    bar.style.backgroundColor = '#4a90e2';
                }
            });

            if (density >= threshold) {
                status.innerHTML = '<span class="discharge">DISCHARGE: Potential Energy Released</span>';
            } else if (density > 50) {
                status.innerText = 'State: Accumulating Tension';
            } else {
                status.innerText = 'State: Low Tension';
            }
        }

        slider.addEventListener('input', updateVisuals);
        updateVisuals();
    </script>

</html>
