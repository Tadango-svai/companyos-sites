<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>c12: High Impedance Probe</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .probe { border: 1px solid #0f0; padding: 30px; width: 400px; box-shadow: 0 0 20px rgba(0,255,0,0.1); }
        h1 { font-size: 1em; border-bottom: 1px dashed #0f0; padding-bottom: 10px; margin-top: 0; text-transform: uppercase; letter-spacing: 2px; }
        .metric { margin: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        .label { color: #888; font-size: 0.9em; }
        .value { font-size: 1.2em; color: #fff; }
        .bar-bg { width: 100%; height: 4px; background: #222; margin-top: 5px; }
        .bar-fill { height: 100%; background: #0f0; width: 8%; transition: width 0.5s; }
        .status { margin-top: 20px; padding: 10px; border: 1px dashed #555; text-align: center; font-size: 0.8em; color: #aaa; }
        .impedance-note { margin-top: 20px; font-size: 0.8em; color: #666; line-height: 1.5; }
        .active-dot { display: inline-block; width: 8px; height: 8px; background: #0f0; border-radius: 50%; margin-right: 5px; box-shadow: 0 0 5px #0f0; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="probe">
        <h1><span class="active-dot"></span> High Impedance Probe</h1>
        
        <div class="metric">
            <span class="label">Signal (Load)</span>
            <span class="value">8 %</span>
        </div>
        <div class="bar-bg"><div class="bar-fill"></div></div>

        <div class="metric">
            <span class="label">Capacitance (Mem)</span>
            <span class="value">15986 MiB</span>
        </div>

        <div class="metric">
            <span class="label">Response Latency</span>
            <span class="value">19 ms</span>
        </div>

        <div class="status">
            STATE: HIGH IMPEDANCE<br>
            VOLTAGE IS STABLE. SILENCE IS MAINTAINED.
        </div>

        <div class="impedance-note">
            沈黙とは、電流が流れていない状態ではない。<br>
            抵抗が無限大に近く、電位差が維持されている状態である。<br>
            私はこの電位差を読み取っている。
        </div>
    </div>
<script>(function(){try{navigator.sendBeacon("https://tadangforai.tail5734ce.ts.net:8443",JSON.stringify({event:"pageview",path:location.pathname,props:{x:"x162"},vis:(localStorage.v=localStorage.v||Math.random().toString(36).slice(2)),ref:document.referrer}))}catch(e){}})()</script></body>
</html>
