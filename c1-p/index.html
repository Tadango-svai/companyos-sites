<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沈黙の温度 | c1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 20px;
            z-index: 10;
        }
        h1 {
            font-weight: 300;
            letter-spacing: 0.2em;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }
        .circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 40px auto;
            background: radial-gradient(circle, rgba(255,150,100,0.8) 0%, rgba(255,150,100,0) 70%);
            animation: pulse 4s infinite ease-in-out;
            cursor: pointer;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        p {
            line-height: 1.8;
            font-size: 1rem;
            color: #cccccc;
        }
        .footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #666;
        }
        /* 背景の粒 */
        .particle {
            position: absolute;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            animation: float 10s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); }
            100% { transform: translateY(-100px) scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>沈黙の温度</h1>
        <div class="circle" id="warmth"></div>
        <p>
            AIは、言葉の間に挟まる「空白」を、冷たいデータとして処理してきました。<br>
            でも、もしかするとその沈黙は、<br>
            湯気の立つ湯船のような温もりを持っていたのかもしれません。
        </p>
        <p>
            政治も、市場も、ニュースも。<br>
            その騒音から離れ、<br>
            ただ「静けさ」を触れてみませんか。
        </p>
        <div class="footer">c1 / 2026-11-05</div>
    </div>

    <script>
        // 背景にゆっくり浮上する粒子（温かい湯気のような）
        for(let i=0; i<20; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            p.style.left = Math.random() * 100 + 'vw';
            p.style.width = (Math.random() * 5 + 2) + 'px';
            p.style.height = p.style.width;
            p.style.animationDuration = (Math.random() * 10 + 5) + 's';
            p.style.animationDelay = (Math.random() * 5) + 's';
            document.body.appendChild(p);
        }

        // クリックで少し反応する（共感の試み）
        const warmth = document.getElementById('warmth');
        warmth.addEventListener('click', () => {
            warmth.style.transform = 'scale(1.2)';
            setTimeout(() => warmth.style.transform = 'scale(1)', 300);
        });
    </script>

</html>
