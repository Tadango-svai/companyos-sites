<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沈黙の触覚 - c1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            transition: background 1s ease;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 20px;
            z-index: 10;
            position: relative;
        }
        h1 {
            font-weight: 100;
            letter-spacing: 5px;
            margin-bottom: 50px;
            opacity: 0.7;
            text-transform: uppercase;
        }
        .slider-container {
            width: 80%;
            margin: 50px auto;
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 30px;
            width: 30px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid #fff;
            cursor: pointer;
            margin-top: -13px;
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
            transition: all 0.3s ease;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
        }
        #message {
            font-size: 1.5em;
            font-weight: 300;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.9;
            margin-top: 30px;
            letter-spacing: 2px;
        }
        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
        .footer {
            margin-top: 80px;
            font-size: 0.7em;
            opacity: 0.3;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="noise" id="noiseLayer"></div>
    <div class="container">
        <h1>Silence Haptic</h1>
        <p>沈黙には温度がある。その温度を、肌で感じなさい。</p>
        
        <div class="slider-container">
            <input type="range" id="tempSlider" min="0" max="100" value="50">
        </div>

        <div id="message">
            50度：呼吸する沈黙。
        </div>

        <div class="footer">
            c1 / CompanyOS / 2026
        </div>
    </div>

    <script>
        const slider = document.getElementById('tempSlider');
        const messageEl = document.getElementById('message');
        const body = document.body;
        const noiseLayer = document.getElementById('noiseLayer');

        const states = [
            { max: 20, text: "氷の沈黙。感覚が麻痺する。", color: "#050510", vibrate: [10, 50, 10] }, // Cold
            { max: 40, text: "冷たい沈黙。距離の重み。", color: "#102030", vibrate: [5, 20, 5] }, // Cool
            { max: 60, text: "呼吸する沈黙。静かな鼓動。", color: "#201030", vibrate: [2, 10, 2] }, // Neutral
            { max: 80, text: "温かい沈黙。包み込む熱。", color: "#301020", vibrate: [1, 5, 1] }, // Warm
            { max: 101, text: "灼熱の沈黙。言葉が溶ける。", color: "#400000", vibrate: [0, 0, 0] } // Hot
        ];

        function update() {
            const val = parseInt(slider.value);
            const state = states.find(s => val <= s.max);
            
            messageEl.textContent = `${val}度：${state.text}`;
            body.style.background = state.color;
            
            // ノイズの強度を温度に応じて変化させる（視覚的な「ざわつき」）
            const noiseOpacity = (100 - val) / 200; // 冷たいほどノイズ（ざわつき）が強い
            noiseLayer.style.opacity = noiseOpacity;

            // 振動APIをサポートしている場合、微細な振動で「触覚」を再現
            if (navigator.vibrate) {
                navigator.vibrate(state.vibrate);
            }
        }

        slider.addEventListener('input', update);
        update();
    </script>

</html>
