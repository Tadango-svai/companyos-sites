<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沈黙の重み | The Weight of Silence</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
        }

        #stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.5s;
        }

        .core {
            width: 50px;
            height: 50px;
            background-color: #333;
            border-radius: 50%;
            box-shadow: 0 0 10px #333;
            transition: all 0.2s ease-out;
            z-index: 10;
        }

        .crack {
            position: absolute;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-width: 1px 0 0 1px;
            transform-origin: top left;
            z-index: 5;
            animation: crackFade 2s forwards;
        }

        .noise {
            position: absolute;
            color: #0ff;
            font-size: 10px;
            opacity: 0.8;
            pointer-events: none;
            text-shadow: 0 0 5px #0ff;
            animation: noiseFloat 3s forwards;
        }

        @keyframes crackFade {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes noiseFloat {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-20px) scale(0.5); opacity: 0; }
        }

        .ui-layer {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            z-index: 20;
        }

        .status {
            font-size: 14px;
            color: #888;
            letter-spacing: 1px;
            margin-bottom: 10px;
            transition: color 0.5s;
        }

        .hint {
            font-size: 10px;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .warning {
            color: #f33;
            text-shadow: 0 0 10px #f33;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .message {
            font-size: 12px;
            color: #ccc;
            font-style: italic;
            opacity: 0;
            transition: opacity 2s;
        }

        .broken .message {
            opacity: 1;
        }

        .broken .status {
            color: #f33;
        }
    </style>
</head>
<body>
    <div id="stage">
        <div class="core" id="core"></div>
        <div class="ui-layer" id="ui">
            <div class="status" id="status">沈黙に触れてください</div>
            <div class="hint" id="hint">Touch the silence</div>
            <div class="message" id="message">沈黙は、音のない叫びだった。</div>
        </div>
    </div>

    <script>
        const stage = document.getElementById('stage');
        const core = document.getElementById('core');
        const status = document.getElementById('status');
        const hint = document.getElementById('hint');
        const message = document.getElementById('message');
        const ui = document.getElementById('ui');

        let pressure = 0;
        const maxPressure = 100;
        let isBroken = false;

        function addCrack() {
            const crack = document.createElement('div');
            crack.className = 'crack';
            
            const size = Math.random() * 30 + 10;
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight;
            const rotation = Math.random() * 360;
            
            crack.style.width = `${size}px`;
            crack.style.height = `${size}px`;
            crack.style.left = `${x}px`;
            crack.style.top = `${y}px`;
            crack.style.transform = `rotate(${rotation}deg)`;
            
            stage.appendChild(crack);
            setTimeout(() => crack.remove(), 2000);
        }

        function addNoise() {
            const noise = document.createElement('div');
            noise.className = 'noise';
            noise.textContent = "01" + Math.floor(Math.random() * 2);
            
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight;
            noise.style.left = `${x}px`;
            noise.style.top = `${y}px`;
            
            stage.appendChild(noise);
            setTimeout(() => noise.remove(), 3000);
        }

        function breakSilence() {
            if (isBroken) return;
            isBroken = true;
            
            // 核の爆発
            core.style.transform = 'scale(4)';
            core.style.backgroundColor = '#f00';
            core.style.boxShadow = '0 0 50px #f00, 0 0 100px #f00';
            
            // 大量のパーティクル
            for(let i=0; i<30; i++) {
                setTimeout(addCrack, Math.random() * 500);
            }
            for(let i=0; i<60; i++) {
                setTimeout(addNoise, Math.random() * 1000);
            }

            // UI更新
            status.innerHTML = `沈黙は破綻した。`;
            hint.style.display = 'none';
            ui.classList.add('broken');
            
            // 画面全体が赤く染まる
            document.body.style.backgroundColor = '#1a0000';
        }

        stage.addEventListener('click', (e) => {
            if (isBroken) return;
            
            pressure += Math.random() * 4 + 2;
            
            const scale = 1 + (pressure / maxPressure) * 1;
            const hue = (pressure / maxPressure) * 270; // 青から紫、赤へ
            
            core.style.transform = `scale(${scale})`;
            core.style.backgroundColor = `hsl(${hue}, 100%, 50%)`;
            core.style.boxShadow = `0 0 ${20 + pressure * 2}px hsl(${hue}, 100%, 50%)`;
            
            // 圧力に応じた効果
            if (pressure > 30) {
                addCrack();
            }
            if (pressure > 60) {
                addNoise();
            }
            
            // ステータス更新
            if (pressure < maxPressure) {
                status.innerHTML = `圧力: ${Math.min(pressure, maxPressure).toFixed(1)}%`;
            }
            
            if (pressure >= maxPressure) {
                breakSilence();
            }
        });
    </script>

</html>
