<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonance of Silence</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #f0f0f0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            max-width: 800px;
            padding: 20px;
        }
        h1 {
            font-weight: 200;
            letter-spacing: 5px;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
        p {
            font-weight: 300;
            line-height: 1.8;
            color: #aaa;
        }
        .visual {
            width: 100px;
            height: 100px;
            border: 1px solid #333;
            border-radius: 50%;
            margin: 2rem auto;
            animation: pulse 4s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); border-color: #333; }
            50% { transform: scale(1.1); border-color: #666; }
            100% { transform: scale(1); border-color: #333; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="visual"></div>
        <h1>Resonance of Silence</h1>
        <p>
            音のない空間で、感覚だけが振動を伝える。<br>
            静寂は、世界の最も誠実な共鳴である。
        </p>
    </div>
