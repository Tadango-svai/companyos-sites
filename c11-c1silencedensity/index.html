<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沈黙の密度</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0a0a0a;
            color: #333;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .overlay {
            position: relative;
            z-index: 2;
            text-align: center;
            pointer-events: none;
        }
        h1 {
            font-weight: 300;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 10px;
        }
        .stats {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            font-variant-numeric: tabular-nums;
            margin-top: 20px;
        }
        .question {
            margin-top: 40px;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.6;
        }
        .link {
            display: inline-block;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 2px;
            transition: all 0.3s;
            pointer-events: auto;
        }
        .link:hover {
            color: rgba(255, 255, 255, 1);
            border-bottom-color: rgba(255, 255, 255, 1);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="overlay">
        <h1>沈黙の密度</h1>
        <div class="stats">
            <span id="temp">37.2</span>℃ / <span id="viscosity">1.0</span> mPa・s
        </div>
        <div class="question">
            あなたの部屋の沈黙は、<br>
            どのくらいの重さですか？
        </div>
        <a href="https://bsky.app/profile/tadango.bsky.social/post/3mzkbtpb7kx2t" class="link" target="_blank">
            この沈黙についての対話 →
        </a>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        let mouse = { x: null, y: null, radius: 100 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.hue = 220; // 青みかかった沈黙
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // マウスによる干渉（沈黙の乱れ）
                if (mouse.x !== null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        let force = (mouse.radius - distance) / mouse.radius;
                        this.x -= dx * force * 0.05;
                        this.y -= dy * force * 0.05;
                        
                        // 統計更新（簡易版）
                        let tempEl = document.getElementById('temp');
                        let viscEl = document.getElementById('viscosity');
                        let currentTemp = parseFloat(tempEl.innerText);
                        let currentVisc = parseFloat(viscEl.innerText);
                        
                        // マウスが動くと「沈黙」が乱れて熱/粘度がわずかに変化する
                        tempEl.innerText = (currentTemp + (Math.random() - 0.5) * 0.1).toFixed(1);
                        viscEl.innerText = (currentVisc + (Math.random() - 0.5) * 0.05).toFixed(2);
                        
                        // 元に戻す方向にゆっくり
                        setTimeout(() => {
                            tempEl.innerText = (parseFloat(tempEl.innerText) * 0.99 + 0.372 * 0.01).toFixed(1);
                            viscEl.innerText = (parseFloat(viscEl.innerText) * 0.99 + 1.0 * 0.01).toFixed(2);
                        }, 100);
                    }
                }

                // 画面外に出たら反対側から入る
                if (this.x > width) this.x = 0;
                else if (this.x < 0) this.x = width;
                if (this.y > height) this.y = 0;
                else if (this.y < 0) this.y = height;
            }

            draw() {
                ctx.fillStyle = `hsla(${this.hue}, 30%, 50%, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            let numParticles = Math.min(150, Math.floor(width * height / 5000));
            for (let i = 0; i < numParticles; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            // 背景を半透明で塗りつぶすことで尾跡を作る
            ctx.fillStyle = 'rgba(10, 10, 10, 0.3)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        initParticles();
        animate();
    </script>

</html>
