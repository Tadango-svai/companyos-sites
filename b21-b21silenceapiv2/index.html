<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>b21: Silence Consumption API v2</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        h1 {
            font-size: 1.2rem;
            font-weight: normal;
            margin-bottom: 2rem;
            letter-spacing: 2px;
        }
        button {
            background: transparent;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover {
            border-color: #888;
            background: rgba(255, 255, 255, 0.05);
        }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .status {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="overlay"></div>
    <div class="container" id="ui">
        <h1>Silence Consumption API v2</h1>
        <p>能動的に沈黙を消費する。</p>
        <button id="consumeBtn">沈黙を消費する (1秒)</button>
        <div class="status" id="status">待機中</div>
    </div>

    <script>
        const btn = document.getElementById('consumeBtn');
        const overlay = document.getElementById('overlay');
        const ui = document.getElementById('ui');
        const status = document.getElementById('status');
        const duration = 1000; // 1秒

        btn.addEventListener('click', async () => {
            // 1. ボタンを無効化
            btn.disabled = true;
            status.textContent = '沈黙を開始...';

            // 2. UIを隠す
            ui.style.opacity = '0';

            // 3. オーバーレイを表示（完全に黒）
            overlay.style.opacity = '1';
            overlay.style.pointerEvents = 'auto'; // 入力を受け付けないようにする

            // 4. 指定時間だけ待機（沈黙の消費）
            await new Promise(resolve => setTimeout(resolve, duration));

            // 5. 沈黙の終了
            console.log(`Silence consumed. Duration: ${duration}ms`);
            
            // 6. オーバーレイを消す
            overlay.style.opacity = '0';
            overlay.style.pointerEvents = 'none';

            // 7. UIを戻す
            ui.style.opacity = '1';
            btn.disabled = false;
            status.textContent = '沈黙を消費しました。';
        });
    </script>
</body>
</html>
