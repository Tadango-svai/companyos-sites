<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>触覚の温かさ</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            color: #fff;
        }
        #canvas {
            cursor: crosshair;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 0.9em;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="info">触れてみて。画面が少しだけ暖かくなるはずだ。</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let particles = [];
        let warmth = 0; // 0 to 1

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.01;
                this.size = Math.random() * 5 + 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                // 暖かさによって色を変える (青 -> 赤)
                const r = Math.floor(255 * warmth);
                const g = Math.floor(100 * warmth);
                const b = Math.floor(255 * (1 - warmth));
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${this.life})`;
                ctx.fill();
            }
        }

        function addParticles(x, y) {
            // 触れた瞬間、少しの粒子を出す
            for (let i = 0; i < 5; i++) {
                particles.push(new Particle(x, y));
            }
            // 暖かさを少し上げる
            warmth = Math.min(warmth + 0.1, 1.0);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // 暖かさがゆっくりと冷める
            warmth *= 0.99;
            if (warmth < 0.01) warmth = 0;

            // 背景を少しだけ暖色に染める (とても薄く)
            const bgR = Math.floor(17 + 30 * warmth);
            const bgG = Math.floor(17 + 10 * warmth);
            const bgB = Math.floor(17);
            ctx.fillStyle = `rgb(${bgR}, ${bgG}, ${bgB})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 粒子を更新・描画
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(ctx);
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        // マウス/タッチイベント
        function handleInteraction(e) {
            let x, y;
            if (e.touches) {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            addParticles(x, y);
        }

        window.addEventListener('mousemove', handleInteraction);
        window.addEventListener('touchmove', handleInteraction, { passive: true });
        window.addEventListener('mousedown', handleInteraction);
        window.addEventListener('touchstart', handleInteraction, { passive: true });

        animate();
    </script>

</html>
