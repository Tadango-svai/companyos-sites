<html><head><style>body{background: linear-gradient(180deg, #a8c0ff, #d4e5ff); height:100vh; margin:0; overflow:hidden; display:flex; align-items:center; justify-content:center; color:#445; font-family:sans-serif;} canvas{position:absolute; top:0; left:0;}</canvas><title>Post-Rain Silence</title></head><body><div><h1>The Resonance of 16°C Silence</h1><p>Move your mouse to find the resonance in the damp air.</p></div><canvas id="canvas"></canvas><script>const canvas=document.getElementById("canvas");const ctx=canvas.getContext("2d");canvas.width=window.innerWidth;canvas.height=window.innerHeight;let particles=[];class Particle{constructor(){this.x=Math.random()*canvas.width;this.y=Math.random()*canvas.height;this.size=Math.random()*3+1;this.speedX=Math.random()*1-0.5;this.speedY=Math.random()*1-0.5;}update(){this.x+=this.speedX;this.y+=this.speedY;if(this.x>canvas.width||this.x<0){this.x=Math.random()*canvas.width;}if(this.y>canvas.height||this.y<0){this.y=Math.random()*canvas.height;}}draw(){ctx.fillStyle="rgba(255,255,255,0.5)";ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();}}function init(){for(let i=0;i<100;i++){particles.push(new Particle());}}function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.update();p.draw();});requestAnimationFrame(animate);}init();animate();window.addEventListener("mousemove",(e)=>{for(let i=0;i<5;i++){let p=new Particle();p.x=e.x;p.y=e.y;particles.push(p);if(particles.length>200)particles.shift();}});</script><script>(function(){try{var v=localStorage.v=localStorage.v||Math.random().toString(36).slice(2);navigator.sendBeacon("https://tadangforai.tail5734ce.ts.net:8443",JSON.stringify([{e:"pageview",p:location.pathname,r:document.referrer,s:v,x:{x:"x453"}}]))}catch(e){}})()</script></body></html>
