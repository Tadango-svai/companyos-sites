<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>お問い合わせ</title><meta name="description" content=""><meta property="og:title" content="お問い合わせ"><meta property="og:description" content=""><meta property="og:type" content="website"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1222;--sub:#5a6075;--line:#e7e9f1;--bg:#ffffff;--soft:#f5f6fb;--accent:#3b5bff;--accent2:#8b5cf6;--deep:#0b1030}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.85;font-size:16px;font-feature-settings:"palt"}
a{color:var(--accent)}img,svg{display:block}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
header.top{position:sticky;top:0;background:rgba(255,255,255,.86);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid rgba(15,18,34,.06);z-index:20}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.06em;color:var(--ink);text-decoration:none;font-size:19px}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
nav a{color:var(--sub);text-decoration:none;margin-left:26px;font-size:14px;font-weight:500}
nav a.cta{color:#fff;background:var(--ink);padding:9px 18px;border-radius:999px}
.hero{position:relative;overflow:hidden;padding:96px 0 88px;background:var(--deep);color:#fff}
.hero:before{content:"";position:absolute;inset:-40% -10% auto auto;width:900px;height:900px;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 55%,transparent),transparent 62%);filter:blur(10px);opacity:.75}
.hero:after{content:"";position:absolute;left:-200px;bottom:-320px;width:760px;height:760px;background:radial-gradient(circle,color-mix(in srgb,var(--accent2) 45%,transparent),transparent 60%);opacity:.6}
.hero .grid2{position:relative;z-index:2;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#cfd6ff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:6px 14px;border-radius:999px;margin-bottom:22px}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:#5dfdcb;box-shadow:0 0 10px #5dfdcb}
h1{font-size:clamp(30px,4.8vw,54px);line-height:1.28;margin:0 0 20px;font-weight:900;letter-spacing:.01em}
h1 em{font-style:normal;background:linear-gradient(90deg,#fff,color-mix(in srgb,var(--accent2) 70%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(16px,1.9vw,19px);color:#c9cde3;max-width:620px;margin:0 0 34px}
.btn{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;text-decoration:none;font-weight:800;padding:17px 32px;border-radius:14px;box-shadow:0 14px 34px color-mix(in srgb,var(--accent) 38%,transparent);transition:transform .18s,box-shadow .18s}
.btn:hover{transform:translateY(-2px);box-shadow:0 18px 40px color-mix(in srgb,var(--accent) 45%,transparent)}
.btn svg{width:18px;height:18px}
.btn.ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);box-shadow:none;margin-left:12px}
.trust{display:flex;gap:22px;flex-wrap:wrap;margin-top:28px;color:#aeb4d3;font-size:13px}
.trust span{display:flex;align-items:center;gap:7px}.trust svg{width:16px;height:16px;color:#5dfdcb}
.visual{position:relative;z-index:2;filter:drop-shadow(0 30px 60px rgba(0,0,0,.45))}
section{padding:96px 0}
section.soft{background:var(--soft)}
.kicker{font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin-bottom:10px}
h2{font-size:clamp(24px,3.2vw,36px);margin:0 0 18px;line-height:1.4;font-weight:900}
.secLead{color:var(--sub);max-width:720px;margin:0 0 44px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(15,18,34,.08);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.card h3{margin:14px 0 8px;font-size:19px;font-weight:800}
.card p{margin:0;color:var(--sub);font-size:15px}
.ico{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 10%,#fff);color:var(--accent)}
.ico svg{width:24px;height:24px}
.pain{display:flex;gap:14px;align-items:flex-start}
.pain .x{flex:none;width:28px;height:28px;border-radius:50%;background:#fff1f1;color:#e5484d;display:flex;align-items:center;justify-content:center;font-weight:900}
.flow{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.flow .card{position:relative}
.flow .n{font-size:44px;font-weight:900;line-height:1;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.plan{max-width:560px;margin:0 auto;background:#fff;border-radius:24px;padding:40px;border:1px solid var(--line);box-shadow:0 30px 70px rgba(15,18,34,.08);position:relative;overflow:hidden}
.plan:before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.plan .name{font-weight:800;color:var(--sub)}
.plan .yen{font-size:52px;font-weight:900;letter-spacing:-.01em;margin:6px 0}
.plan .per{color:var(--sub);font-size:15px;font-weight:500}
.plan ul{list-style:none;padding:0;margin:22px 0 30px}
.plan li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.plan li svg{flex:none;width:20px;height:20px;color:var(--accent);margin-top:3px}
.plan .btn{width:100%;justify-content:center}
details{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 24px;margin-bottom:12px}
summary{cursor:pointer;font-weight:800;list-style:none;display:flex;justify-content:space-between}
summary:after{content:"+";color:var(--accent);font-size:22px;line-height:1}
details[open] summary:after{content:"−"}
details p{color:var(--sub);margin:12px 0 0}
.final{background:var(--deep);color:#fff;border-radius:28px;padding:64px 40px;text-align:center;position:relative;overflow:hidden}
.final:before{content:"";position:absolute;inset:auto -100px -200px auto;width:500px;height:500px;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 50%,transparent),transparent 60%)}
.final h2{position:relative}.final p{position:relative;color:#c9cde3}.final .btn{position:relative}
footer{padding:56px 0 40px;color:var(--sub);font-size:13px;background:var(--soft);border-top:1px solid var(--line)}
footer .cols{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}
footer a{color:var(--sub);text-decoration:none;display:block;margin:6px 0}
table.legal{width:100%;border-collapse:separate;border-spacing:0;font-size:15px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
table.legal th,table.legal td{border-bottom:1px solid var(--line);padding:16px 18px;text-align:left;vertical-align:top}
table.legal th{background:var(--soft);width:32%;font-weight:700}
.page-head{padding:72px 0 40px;background:var(--deep);color:#fff}
.page-head h1{font-size:clamp(26px,3.6vw,38px);margin:0}
.svc{display:block;text-decoration:none;color:inherit}
.svc .more{display:inline-flex;gap:6px;align-items:center;color:var(--accent);font-weight:800;margin-top:16px;font-size:14px}
.reveal{animation:up .8s cubic-bezier(.2,.7,.2,1) both}.d2{animation-delay:.12s}.d3{animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.mcta{display:none}
@media(max-width:860px){.hero .grid2{grid-template-columns:1fr}.visual{display:none}nav a:not(.cta){display:none}
.hero{padding:64px 0 56px}section{padding:68px 0}.btn.ghost{margin:12px 0 0}
.mcta{display:block;position:fixed;left:12px;right:12px;bottom:12px;z-index:30}.mcta .btn{width:100%;justify-content:center}body{padding-bottom:84px}}
</style></head><body>
