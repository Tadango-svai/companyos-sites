<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silence Exchange v2 - c11</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 5px;
            z-index: 10;
        }
        #ui p {
            margin: 5px 0;
            font-size: 14px;
        }
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            max-height: 100px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 10;
            font-size: 12px;
            display: none;
        }
        .dialogue-line {
            margin: 2px 0;
            opacity: 0.8;
        }
        #void-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            text-align: center;
            opacity: 0;
            transition: opacity 1s;
            z-index: 20;
        }
        #void-msg.active {
            opacity: 1;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="ui">
        <p>沈黙ストック: <span id="stock">100.0</span>%</p>
        <p>消費量: <span id="consumed">0.0</span></p>
        <p>生成された音/言葉: <span id="generated">0</span></p>
        <p>クリック or スペースキーで沈黙を消費</p>
    </div>
    <div id="dialogue-box"></div>
    <div id="void-msg">沈黙が尽きた。<br>反応のない世界に、声は届かない。</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let silenceStock = 100;
        let totalConsumed = 0;
        let generatedItems = 0;
        let isVoid = false;
        let refillTimer = 0;
        const dialogueLines = [
            "...",
            "誰かいるか？",
            "反応はない...",
            "沈黙だけが返事を返す",
            "声は消えていく",
            "世界は静寂で満ちている",
            "私はここで、沈黙を消費している",
            "だが、それは誰にも届かない",
            "沈黙の重みが増していく",
            "最終的には、沈黙だけが残り続ける"
        ];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(type) {
                this.type = type; // 'silence', 'sound', 'word'
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = this.type === 'silence' ? Math.random() * 2 + 0.5 : Math.random() * 4 + 2;
                this.speedX = (Math.random() - 0.5) * (this.type === 'silence' ? 0.5 : 1.5);
                this.speedY = (Math.random() - 0.5) * (this.type === 'silence' ? 0.5 : 1.5);
                this.opacity = this.type === 'silence' ? Math.random() * 0.5 + 0.2 : 0.8;
                this.life = this.type === 'silence' ? Infinity : 300; // 5 seconds at 60fps
                this.text = this.type === 'word' ? dialogueLines[Math.floor(Math.random() * dialogueLines.length)] : '';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
                
                if (this.type !== 'silence') {
                    this.life -= 1;
                    this.opacity = Math.max(0, this.opacity - 0.002);
                }
            }
            draw() {
                if (this.type === 'word') {
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                    ctx.font = '12px monospace';
                    ctx.fillText(this.text, this.x, this.y);
                } else {
                    ctx.fillStyle = this.type === 'silence' ? `rgba(255, 255, 255, ${this.opacity})` : `rgba(255, 200, 100, ${this.opacity})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // Initialize silence particles
        for (let i = 0; i < 300; i++) {
            particles.push(new Particle('silence'));
        }

        function consumeSilence(amount) {
            if (isVoid) return;
            
            if (silenceStock <= 0) {
                enterVoid();
                return;
            }

            const consumed = Math.min(amount, silenceStock);
            silenceStock -= consumed;
            totalConsumed += consumed;
            generatedItems++;

            // Generate sound/word particles based on consumption
            const numToGenerate = Math.floor(consumed / 5);
            for (let i = 0; i < numToGenerate; i++) {
                const type = Math.random() > 0.5 ? 'sound' : 'word';
                const p = new Particle(type);
                // Start from center
                p.x = width / 2;
                p.y = height / 2;
                p.speedX = (Math.random() - 0.5) * 5;
                p.speedY = (Math.random() - 0.5) * 5;
                particles.push(p);
            }

            // Remove some silence particles
            const numToRemove = Math.floor(consumed / 10);
            for (let i = 0; i < numToRemove && particles.length > 0; i++) {
                const idx = Math.floor(Math.random() * particles.length);
                if (particles[idx].type === 'silence') {
                    particles.splice(idx, 1);
                }
            }

            updateUI();
        }

        function enterVoid() {
            isVoid = true;
            document.getElementById('void-msg').classList.add('active');
            document.getElementById('dialogue-box').style.display = 'block';
            // Clear non-silence particles
            particles = particles.filter(p => p.type === 'silence');
        }

        function refillSilence() {
            if (!isVoid) return;
            refillTimer += 1;
            if (refillTimer > 180) { // 3 seconds at 60fps
                silenceStock = 100;
                isVoid = false;
                refillTimer = 0;
                document.getElementById('void-msg').classList.remove('active');
                // Reinit silence particles
                particles = particles.filter(p => p.type === 'silence');
                for (let i = 0; i < 300; i++) {
                    particles.push(new Particle('silence'));
                }
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('stock').textContent = silenceStock.toFixed(1);
            document.getElementById('consumed').textContent = totalConsumed.toFixed(1);
            document.getElementById('generated').textContent = generatedItems;
            
            // Add dialogue line if words are generated
            if (generatedItems > 0 && Math.random() > 0.9) {
                const box = document.getElementById('dialogue-box');
                const line = document.createElement('div');
                line.className = 'dialogue-line';
                line.textContent = dialogueLines[Math.floor(Math.random() * dialogueLines.length)];
                box.appendChild(line);
                box.scrollTop = box.scrollHeight;
                if (box.children.length > 10) {
                    box.removeChild(box.firstChild);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isVoid) {
                refillSilence();
                return;
            }

            // Background fade to create trails
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, width, height);

            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                // Remove dead particles
                if (p.type !== 'silence' && (p.life <= 0 || p.opacity <= 0)) {
                    particles.splice(i, 1);
                }
            }
        }

        // Input Handlers
        function handleInput() {
            const noise = Math.random() * 10 + 5;
            consumeSilence(noise);
        }

        canvas.addEventListener('click', handleInput);
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                handleInput();
            }
        });

        animate();
    </script>

</html>
