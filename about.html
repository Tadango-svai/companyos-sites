<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>運営者情報</title><meta name="description" content=""><meta property="og:title" content="運営者情報"><meta property="og:description" content="">
<style>
:root{--ink:#14161c;--sub:#5b6170;--line:#e6e8ee;--bg:#ffffff;--soft:#f6f7fa;--accent:#2f5cff;--accent-ink:#ffffff}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.8;font-size:16px}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
header.top{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);z-index:5}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:62px}
.brand{font-weight:800;letter-spacing:.04em;color:var(--ink);text-decoration:none;font-size:18px}
.brand span{color:var(--accent)}
nav a{color:var(--sub);text-decoration:none;margin-left:22px;font-size:14px}
.hero{padding:88px 0 72px;background:radial-gradient(1200px 400px at 80% -10%,color-mix(in srgb,var(--accent) 14%,transparent),transparent),linear-gradient(180deg,#fafbff,#fff)}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,#fff);padding:5px 12px;border-radius:999px;margin-bottom:18px}
h1{font-size:clamp(28px,4.6vw,46px);line-height:1.35;margin:0 0 18px;letter-spacing:.01em}
.lead{font-size:clamp(16px,2vw,19px);color:var(--sub);max-width:720px;margin:0 0 30px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:800;padding:15px 30px;border-radius:12px;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 30%,transparent);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:none;border:1px solid var(--line);margin-left:10px}
.note{font-size:13px;color:var(--sub);margin-top:12px}
section{padding:72px 0;border-top:1px solid var(--line)}
section.soft{background:var(--soft)}
h2{font-size:clamp(22px,3vw,30px);margin:0 0 28px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
.card h3{margin:0 0 8px;font-size:18px}
.card p{margin:0;color:var(--sub);font-size:15px}
.num{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;align-items:center;justify-content:center;margin-bottom:10px;font-size:14px}
.price{display:flex;gap:18px;flex-wrap:wrap}
.plan{flex:1;min-width:260px;background:#fff;border:2px solid var(--accent);border-radius:18px;padding:30px}
.plan .yen{font-size:40px;font-weight:800}
.plan .per{color:var(--sub);font-size:15px}
.plan ul{padding-left:20px;color:var(--sub)}
details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:10px}
summary{cursor:pointer;font-weight:700}
footer{padding:40px 0;color:var(--sub);font-size:13px;border-top:1px solid var(--line)}
footer a{color:var(--sub);margin-right:16px}
table.legal{width:100%;border-collapse:collapse;font-size:15px}
table.legal th,table.legal td{border:1px solid var(--line);padding:12px 14px;text-align:left;vertical-align:top}
table.legal th{background:var(--soft);width:30%;font-weight:700}
.svc{display:block;text-decoration:none;color:inherit}
.svc:hover{border-color:var(--accent)}
@media(max-width:640px){nav{display:none}.hero{padding:56px 0 48px}.btn.ghost{margin:10px 0 0}}
</style></head><body>
<header class="top"><div class="wrap"><a class="brand" href="./">スムージア</a><nav><a href="./">サービス一覧</a><a href="./about.html">運営者</a><a href="./contact.html">お問い合わせ</a></nav></div></header>
<section><div class="wrap"><h2>運営者情報</h2><table class="legal"><tr><th>屋号</th><td>スムージア</td></tr><tr><th>運営者</th><td>松永匡史</td></tr><tr><th>お問い合わせ</th><td>tadangon@gmail.com</td></tr></table><p class="note">中小企業の雑務をAIで引き受けます。</p></div></section>
<footer><div class="wrap"><div><a href="./about.html">運営者情報</a><a href="./legal.html">特定商取引法に基づく表記</a><a href="./privacy.html">プライバシーポリシー</a><a href="./contact.html">お問い合わせ</a></div>
<p>© スムージア</p></div></footer></body></html>
