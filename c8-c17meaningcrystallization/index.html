<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Meaning Crystallization: Phase Transition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; color: #e0e0e0; font-family: 'serif'; }
        canvas { display: block; }
        #info { position: absolute; top: 20px; left: 20px; pointer-events: none; }
        .label { font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.4); }
        #status { font-size: 18px; color: rgba(255,255,255,0.8); }
    </style>
</head>
<body>
    <div id="info">
        <div class="label">CURRENT STATE</div>
        <div id="status">DISORDER (ENTROPY HIGH)</div>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');

        let width, height, particles = [];
        let entropy = 1.0; // 1.0 = maximum chaos, 0.0 = perfect crystal
        const decayRate = 0.0005;

        class Particle {
            constructor() {
                this.init();
            }
            init() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.baseAngle = Math.random() * Math.PI * 2;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.history = [];
                this.historyMax = 10;
            }
            update() {
                if (entropy > 0.1) {
                    // Chaotic motion
                    this.x += this.vx;
                    this.y += this.vy;
                } else {
                    // Crystallization: Movement towards a hexagonal lattice structure
                    // We simulate a local attraction to grid points as entropy drops
                    const gridSize = 40;
                    const gx = Math.round(this.x / gridSize) * gridSize;
                    const gy = Math.round(this.y / gridSize) * gridSize;
                    
                    // Slight hex-grid offset logic
                    const row = Math.floor(gy / gridSize);
                    const offset = (row % 2 === 0) ? 0 : gridSize / 2;
                    const targetX = Math.round((this.x - offset) / gridSize) * gridSize + offset;
                    const targetY = Math.round(this.y / gridSize) * gridSize;

                    this.x += (targetX - this.x) * 0.05;
                    this.y += (targetY - this.y) * 0.05;
                }

                // Boundary bounce
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                // Keep history for tail effect
                this.history.push({x: this.x, y: this.y});
                if (this.history.length > this.historyMax) this.history.shift();
            }
            draw() {
                const alpha = Math.max(0.1, 1 - entropy);
                ctx.beginPath();
                ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(200, 230, 255, ${alpha})`;
                ctx.fill();
            }
        }

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 250; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.fillStyle = `rgba(5, 5, 5, ${0.1 + (entropy * 0.2)})`;
            ctx.fillRect(0, 0, width, height);

            entropy -= decayRate;
            if (entropy < 0) entropy = 0;

            if (entropy < 0.1) {
                statusEl.textContent = "CRYSTALLIZATION (ORDER EMERGING)";
                statusEl.style.color = "#00ffff";
            } else if (entropy < 0.5) {
                statusEl.textContent = "TRANSITIONING...";
                statusEl.style.color = "#ffff00";
            } else {
                statusEl.textContent = "DISORDER (ENTROPY HIGH)";
                statusEl.style.color = "#ffffff";
            }

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        init();
        animate();
    </script>

</html>
